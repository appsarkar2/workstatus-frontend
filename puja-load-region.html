<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Region Report — WorkStatus</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="app-body">

  <div id="app"></div>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/components.js"></script>

  <script>
    const user = getCurrentUser();
    if (user.role === "division_user") {
      window.location.href = "/puja-load.html";
    }

    const blockApi = BlockAPI("puja_load_demand");
    const app = document.getElementById("app");

    let blockConfig = null;
    let reportData = [];
    let reportDate = ""; 
    let reportDateFormatted = ""; 
    let reportHour = "";
    let missingDivisions = []; 
    
    let rangeData = {};
    let dateRangeArray = [];

    const displayHours = ["17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];

    function renderShell() {
      const today = new Date().toISOString().split("T")[0];
      
      app.innerHTML = `
        ${header({
          title: "Region Report",
          back: true,
          backUrl: "/puja-load.html"
        })}
        
        <section class="detail-card" style="margin-top: 16px;">
          <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 140px;">
              <label style="font-size: 12px; font-weight: bold; color: var(--color-text-muted);">Start Date</label>
              <input type="date" id="startDateInput" value="${today}" class="modal-input" style="margin-bottom: 0;" />
            </div>
            <div style="flex: 1; min-width: 140px;">
              <label style="font-size: 12px; font-weight: bold; color: var(--color-text-muted);">End Date</label>
              <input type="date" id="endDateInput" value="${today}" class="modal-input" style="margin-bottom: 0;" />
            </div>
            <div style="flex: 1; min-width: 120px;">
              <label style="font-size: 12px; font-weight: bold; color: var(--color-text-muted);">Hour</label>
              <select id="hourInput" class="modal-input" style="margin-bottom: 0;">
                ${displayHours.map(h => `<option value="${h}">${h} hrs</option>`).join("")}
              </select>
            </div>
            <button class="btn-primary" onclick="loadReport()" style="width: auto; padding: 10px 20px; height: 42px;">View</button>
          </div>
        </section>

        <div id="reportContent" style="overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%;">
          ${emptyState("⏳", "Select dates and click View")}
        </div>
      `;
    }

    async function loadReport() {
      const startDate = document.getElementById("startDateInput").value;
      const endDate = document.getElementById("endDateInput").value;
      const time = document.getElementById("hourInput").value;
      
      if (!startDate || !endDate || !time) { showToast("Please select dates and hour", "error"); return; }
      if (startDate > endDate) { showToast("Start Date cannot be after End Date", "error"); return; }

      reportDate = endDate; 
      const [y, m, d] = endDate.split("-");
      reportDateFormatted = `${d}-${m}-${y}`;
      reportHour = time;

      const content = document.getElementById("reportContent");
      content.innerHTML = emptyState("⏳", "Loading report...");

      try {
        if (!blockConfig) blockConfig = await blockApi.getConfig();

        const data = await blockApi.list({ search: endDate }); 
        const currEntries = data.items.filter(e => e.date === endDate);
        
        const rangePeaks = await apiFetch(`/api/blocks/puja_load_demand/report/date-range-peaks?start_date=${startDate}&end_date=${endDate}`);

        const divisionsMap = {};
        missingDivisions = []; 

        blockConfig.divisions.forEach(div => {
           const capacity = div.substations.reduce((sum, s) => sum + s.capacity_mva, 0);
           divisionsMap[div.name] = { name: div.name, capacity: capacity, hours: {} };
        });

        currEntries.forEach(entry => {
           if (divisionsMap[entry.division]) {
               divisionsMap[entry.division].hours[entry.time] = entry;
           }
        });

        reportData = Object.values(divisionsMap);
        
        reportData.forEach(div => {
           let maxLoad = 0;
           let peakHour = "";
           
           displayHours.forEach(h => {
               const entry = div.hours[h];
               if (entry && entry.total_load_mva > maxLoad) {
                   maxLoad = entry.total_load_mva;
                   peakHour = h;
               }
           });
           
           div.peak_load = maxLoad;
           div.peak_hour = peakHour;

           if (!div.hours[reportHour]) {
               missingDivisions.push(div.name);
           }
        });

        dateRangeArray = [];
        let curr = new Date(startDate);
        let last = new Date(endDate);
        while (curr <= last) {
            const cy = curr.getFullYear();
            const cm = String(curr.getMonth() + 1).padStart(2, '0');
            const cd = String(curr.getDate()).padStart(2, '0');
            dateRangeArray.push(`${cy}-${cm}-${cd}`);
            curr.setDate(curr.getDate() + 1);
        }

        rangeData = {};
        reportData.forEach(div => {
            rangeData[div.name] = {};
            dateRangeArray.forEach(dateStr => {
                if (rangePeaks[div.name] && rangePeaks[div.name][dateStr]) {
                    rangeData[div.name][dateStr] = {
                        load: rangePeaks[div.name][dateStr].load,
                        time: rangePeaks[div.name][dateStr].time
                    };
                } else {
                    rangeData[div.name][dateStr] = { load: 0, time: "-" };
                }
            });
        });

        renderGrid();
      } catch (e) {
        content.innerHTML = emptyState("⚠️", "Failed to load", e.message);
      }
    }

    function renderGrid() {
      const content = document.getElementById("reportContent");
      
      let grandTotalCapacity = 0;
      let grandTotalPeak = 0;
      const regionHourlyTotals = {};
      displayHours.forEach(h => { regionHourlyTotals[h] = 0; });

      const thStyle = "padding: 8px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 60px; white-space: nowrap;";
      const tdStyle = "padding: 8px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; white-space: normal; word-wrap: break-word; min-width: 60px;";

      let tableHeaders = `
        <th rowspan="2" style="padding: 8px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 100px;">Division</th>
        <th rowspan="2" style="${thStyle}">Inst. Capacity<br>(MVA)</th>
        <th rowspan="2" style="${thStyle}">Peak Load<br>(MVA)<br><span style="font-size: 10px; font-weight: normal;">(Time & Date)</span></th>
      `;

      displayHours.forEach(h => {
        tableHeaders += `<th colspan="2" style="padding: 6px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #e2e8f0; font-size: 12px; white-space: nowrap;">${h}</th>`;
      });

      let subHeaders = `<tr>`;
      displayHours.forEach(h => {
        subHeaders += `
          <th style="padding: 4px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f1f5f9; font-size: 10px; width: 50px;">Load</th>
          <th style="padding: 4px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f1f5f9; font-size: 10px; width: 50px;">%</th>
        `;
      });
      subHeaders += `</tr>`;

      let tableRows = reportData.map(div => {
        grandTotalCapacity += div.capacity;
        grandTotalPeak += div.peak_load;

        let rowHtml = `
          <tr>
            <td style="padding: 8px; border: 1px solid #cbd5e1; font-weight: bold; text-align: left; vertical-align: middle; min-width: 100px; white-space: nowrap;">${escapeHtml(div.name)}</td>
            <td style="${tdStyle}">${div.capacity.toFixed(2)}</td>
            <td style="${tdStyle} min-width: 120px;">
                ${div.peak_load > 0 
                  ? `<div style="font-weight: bold; font-size: 14px;">${div.peak_load.toFixed(2)}</div>
                     <div style="font-size: 11px; color: #64748b; white-space: nowrap;">at ${div.peak_hour} on ${reportDateFormatted}</div>` 
                  : "—"}
            </td>
        `;

        displayHours.forEach(h => {
           const entry = div.hours[h];
           if (entry) {
              const pct = ((entry.total_load_mva / div.capacity) * 100).toFixed(1);
              regionHourlyTotals[h] += entry.total_load_mva; 
              rowHtml += `
                <td style="${tdStyle}">${entry.total_load_mva.toFixed(2)}</td>
                <td style="${tdStyle} color: #64748b;">${pct}%</td>
              `;
           } else {
              rowHtml += `<td style="${tdStyle} color: #cbd5e1;">-</td><td style="${tdStyle} color: #cbd5e1;">-</td>`;
           }
        });

        rowHtml += `</tr>`;
        return rowHtml;
      }).join("");

      let totalRowHourlyHtml = "";
      displayHours.forEach(h => {
          const load = regionHourlyTotals[h];
          if (load > 0) {
              const pct = ((load / grandTotalCapacity) * 100).toFixed(1);
              totalRowHourlyHtml += `<td style="${tdStyle}">${load.toFixed(2)}</td><td style="${tdStyle} color: #64748b;">${pct}%</td>`;
          } else {
              totalRowHourlyHtml += `<td style="${tdStyle} color: #cbd5e1;">-</td><td style="${tdStyle} color: #cbd5e1;">-</td>`;
          }
      });

      let rangeHeaders = `
        <th style="padding: 8px; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 50px;">Sl No</th>
        <th style="padding: 8px; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 150px;">Name of Division</th>
        <th style="padding: 8px; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 100px;">Inst. Capacity (MVA)</th>
      `;
      
      dateRangeArray.forEach(dateStr => {
          const [y, m, d] = dateStr.split("-");
          rangeHeaders += `<th style="padding: 8px; border: 1px solid #cbd5e1; background: #e2e8f0; min-width: 80px;">${d}/${m}/${y}</th>`;
      });

      let totalRegionRange = {};
      dateRangeArray.forEach(dateStr => { totalRegionRange[dateStr] = 0; });

      let rangeRows = reportData.map((div, index) => {
          let row = `
            <tr>
              <td style="${tdStyle}">${index + 1}</td>
              <td style="${tdStyle} font-weight: bold; text-align: left;">${escapeHtml(div.name)}</td>
              <td style="${tdStyle}">${div.capacity.toFixed(2)}</td>
          `;

          dateRangeArray.forEach(dateStr => {
              const peak = rangeData[div.name][dateStr];
              if (peak && peak.load > 0) {
                  totalRegionRange[dateStr] += peak.load;
                  row += `
                    <td style="${tdStyle}">
                        <div style="font-weight: bold; font-size: 13px;">${peak.load.toFixed(2)}</div>
                        <div style="font-size: 10px; color: #64748b;">at ${peak.time}</div>
                    </td>
                  `;
              } else {
                  row += `<td style="${tdStyle} color: #cbd5e1;">-</td>`;
              }
          });

          row += `</tr>`;
          return row;
      }).join("");

      let totalRangeCells = "";
      dateRangeArray.forEach(dateStr => {
          const sum = totalRegionRange[dateStr];
          if (sum > 0) {
              totalRangeCells += `<td style="${tdStyle} font-weight: bold;">${sum.toFixed(2)}</td>`;
          } else {
              totalRangeCells += `<td style="${tdStyle} color: #cbd5e1;">-</td>`;
          }
      });

      const [sy, sm, sd] = dateRangeArray[0].split("-");
      const [ey, em, ed] = dateRangeArray[dateRangeArray.length-1].split("-");
      const startDateFormatted = `${sd}-${sm}-${sy}`;
      const endDateFormatted = `${ed}-${em}-${ey}`;

      content.innerHTML = `
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px;">
          <h2 class="section-title" style="margin: 0; flex: 1;">Division-wise Hourly System Load in MVA as on : ${reportDateFormatted}</h2>
          <div style="display: flex; gap: 10px;">
            <button class="btn-primary" onclick="downloadExcel()" style="width: auto; padding: 8px 16px; background: #16a34a;">📊 Download Excel</button>
            <button class="btn-primary" onclick="downloadPDF()" style="width: auto; padding: 8px 16px; background: #dc2626;">📄 Download PDF</button>
          </div>
        </div>

        <table style="width: 100%; min-width: 1200px; border-collapse: collapse; font-size: 12px; background: #fff; table-layout: auto; margin-bottom: 40px;">
          <thead><tr>${tableHeaders}</tr>${subHeaders}</thead>
          <tbody>
            ${tableRows}
            <tr style="background: #f8fafc; font-weight: bold;">
              <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: left; vertical-align: middle; min-width: 100px;">TOTAL REGION</td>
              <td style="${tdStyle}">${grandTotalCapacity.toFixed(2)}</td>
              <td style="${tdStyle}">${grandTotalPeak.toFixed(2)}</td>
              ${totalRowHourlyHtml}
            </tr>
          </tbody>
        </table>

        <div style="margin-bottom: 15px; width: 100%;">
            <h2 class="section-title" style="margin: 0; text-align: center;">Division-wise Peak Load in MVA (${startDateFormatted} to ${endDateFormatted})</h2>
        </div>
        
        <table style="width: 100%; min-width: 800px; border-collapse: collapse; font-size: 12px; background: #fff; table-layout: auto; margin-bottom: 50px;">
            <thead><tr>${rangeHeaders}</tr></thead>
            <tbody>
                ${rangeRows}
                <tr style="background: #f8fafc; font-weight: bold;">
                    <td colspan="2" style="padding: 8px; border: 1px solid #cbd5e1; text-align: left; vertical-align: middle;">TOTAL REGION</td>
                    <td style="${tdStyle}">${grandTotalCapacity.toFixed(2)}</td>
                    ${totalRangeCells}
                </tr>
            </tbody>
        </table>
      `;
    }

    async function downloadPDF() {
      if (missingDivisions.length > 0) {
        const confirmMsg = `The following divisions have not entered data for ${reportHour} hrs on ${reportDateFormatted}:\n\n${missingDivisions.join(", ")}\n\nDo you still want to download the report?`;
        const proceed = await showConfirm({ title: "Missing Data", message: confirmMsg, confirmText: "Yes, Download", cancelText: "Cancel" });
        if (!proceed) return; 
      }
      generatePDF();
    }

    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', format: 'a3' });
      const pageWidth = doc.internal.pageSize.getWidth();

      doc.setFontSize(16);
      doc.setTextColor(30, 64, 175); 
      doc.setFont("helvetica", "bold");
      doc.text(`PUJA Load Demand Report Darjeeling Region`, pageWidth / 2, 15, { align: 'center' });
      
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.text(`Division-wise Hourly System Load in MVA as on : ${reportDateFormatted}`, pageWidth / 2, 25, { align: 'center' });

      let head1 = [ [ { content: 'Division', rowSpan: 2 }, { content: 'Inst. Cap\n(MVA)', rowSpan: 2 }, { content: 'Peak Load\n(Time & Date)', rowSpan: 2 } ], [] ];
      displayHours.forEach(h => {
        head1[0].push({ content: h, colSpan: 2, styles: { halign: 'center', fillColor: [219, 234, 254], textColor: [30, 64, 175], fontStyle: 'bold' } });
        head1[1].push({ content: 'Load', styles: { halign: 'center', fontSize: 8 } });
        head1[1].push({ content: '%', styles: { halign: 'center', fontSize: 8 } });
      });

      const body1 = reportData.map(div => {
         let peakStr = "-";
         if (div.peak_load > 0) peakStr = `${div.peak_load.toFixed(2)}\n(at ${div.peak_hour})`;
         let row = [ { content: div.name, styles: { fontStyle: 'bold', halign: 'left' } }, div.capacity.toFixed(2), peakStr ];
         displayHours.forEach(h => {
            const entry = div.hours[h];
            if (entry) {
                const pct = ((entry.total_load_mva / div.capacity) * 100).toFixed(1);
                row.push(entry.total_load_mva.toFixed(2)); row.push(pct + "%");
            } else {
                row.push("-"); row.push("-");
            }
         });
         return row;
      });

      const regionHourlyTotals = {};
      displayHours.forEach(h => { regionHourlyTotals[h] = 0; });
      let grandTotalCapacity = 0;
      reportData.forEach(div => {
         grandTotalCapacity += div.capacity;
         displayHours.forEach(h => { const entry = div.hours[h]; if (entry) regionHourlyTotals[h] += entry.total_load_mva; });
      });

      let totalRow = [ { content: "TOTAL REGION", styles: { fontStyle: 'bold', halign: 'left' } }, { content: grandTotalCapacity.toFixed(2), styles: { fontStyle: 'bold' } }, { content: "—", styles: { fontStyle: 'bold' } } ];
      displayHours.forEach(h => {
         const load = regionHourlyTotals[h];
         if (load > 0) {
             const pct = ((load / grandTotalCapacity) * 100).toFixed(1);
             totalRow.push({ content: load.toFixed(2), styles: { fontStyle: 'bold' } }); totalRow.push({ content: pct + "%", styles: { fontStyle: 'bold' } });
         } else {
             totalRow.push({ content: "-", styles: { fontStyle: 'bold' } }); totalRow.push({ content: "-", styles: { fontStyle: 'bold' } });
         }
      });
      body1.push(totalRow);

      doc.autoTable({
        startY: 28, head: head1, body: body1, theme: 'grid', tableWidth: 'auto', 
        styles: { fontSize: 7, cellPadding: 1.5, overflow: 'linebreak', halign: 'center', valign: 'middle', textColor: [15, 23, 42], lineColor: [203, 213, 225], lineWidth: 0.1 },
        headStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' },
        columnStyles: { 0: { cellWidth: 35 }, 1: { cellWidth: 15 }, 2: { cellWidth: 35 } },
        alternateRowStyles: { fillColor: [248, 250, 252] }, margin: { left: 14, right: 14 }
      });

      // --- TABLE 2: DATE RANGE PEAKS ---
      let currentY = doc.lastAutoTable.finalY + 8; 
      
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      const [sy, sm, sd] = dateRangeArray[0].split("-");
      const [ey, em, ed] = dateRangeArray[dateRangeArray.length-1].split("-");
      doc.text(`Division-wise Peak Load in MVA (${sd}-${sm}-${sy} to ${ed}-${em}-${ey})`, pageWidth / 2, currentY, { align: 'center' });

      let head2 = [ ["Sl No", "Name of Division", "Inst. Capacity\n(MVA)"] ];
      dateRangeArray.forEach(dateStr => {
          const [y, m, d] = dateStr.split("-");
          head2[0].push(`${d}/${m}/${y}`);
      });

      let totalRegionRange = {};
      dateRangeArray.forEach(dateStr => { totalRegionRange[dateStr] = 0; });

      let body2 = reportData.map((div, index) => {
          let row = [ index + 1, { content: div.name, styles: { fontStyle: 'bold', halign: 'left' } }, div.capacity.toFixed(2) ];
          dateRangeArray.forEach(dateStr => {
              const peak = rangeData[div.name][dateStr];
              if (peak && peak.load > 0) {
                  totalRegionRange[dateStr] += peak.load;
                  row.push(`${peak.load.toFixed(2)}\nat ${peak.time}`);
              } else {
                  row.push("-");
              }
          });
          return row;
      });

      let totalRangeRow = [ { content: "TOTAL REGION", colSpan: 2, styles: { fontStyle: 'bold', halign: 'left' } }, { content: grandTotalCapacity.toFixed(2), styles: { fontStyle: 'bold' } } ];
      dateRangeArray.forEach(dateStr => {
          const sum = totalRegionRange[dateStr];
          if (sum > 0) {
              totalRangeRow.push({ content: sum.toFixed(2), styles: { fontStyle: 'bold' } });
          } else {
              totalRangeRow.push({ content: "-", styles: { fontStyle: 'bold' } });
          }
      });
      body2.push(totalRangeRow);

      doc.autoTable({
        startY: currentY + 3, head: head2, body: body2, theme: 'grid', tableWidth: 'auto', 
        styles: { fontSize: 7, cellPadding: 1.5, overflow: 'linebreak', halign: 'center', valign: 'middle', textColor: [15, 23, 42], lineColor: [203, 213, 225], lineWidth: 0.1 },
        headStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' },
        columnStyles: { 0: { cellWidth: 12 }, 1: { cellWidth: 40 }, 2: { cellWidth: 25 } },
        alternateRowStyles: { fillColor: [248, 250, 252] }, margin: { left: 14, right: 14 }
      });

      doc.save(`Load_Report_${dateRangeArray[0]}_to_${dateRangeArray[dateRangeArray.length-1]}.pdf`);
    }

    function downloadExcel() {
        let csvContent = "data:text/csv;charset=utf-8,";
        
        csvContent += `Division-wise Hourly System Load in MVA as on : ${reportDateFormatted}\n\n`;
        let headers1 = ["Division", "Inst. Capacity (MVA)", "Peak Load (MVA)", "Peak Time"];
        displayHours.forEach(h => { headers1.push(`${h} Load`, `${h} %`); });
        csvContent += headers1.join(",") + "\n";

        reportData.forEach(div => {
            let row = [`"${div.name}"`, div.capacity.toFixed(2), div.peak_load.toFixed(2), div.peak_load > 0 ? `"at ${div.peak_hour}"` : "-"];
            displayHours.forEach(h => {
                const entry = div.hours[h];
                if (entry) {
                    row.push(entry.total_load_mva.toFixed(2));
                    row.push(((entry.total_load_mva / div.capacity) * 100).toFixed(1) + "%");
                } else {
                    row.push("-", "-");
                }
            });
            csvContent += row.join(",") + "\n";
        });

        csvContent += "\n\n"; 

        const [sy, sm, sd] = dateRangeArray[0].split("-");
        const [ey, em, ed] = dateRangeArray[dateRangeArray.length-1].split("-");
        csvContent += `Division-wise Peak Load in MVA (${sd}-${sm}-${sy} to ${ed}-${em}-${ey})\n\n`;
        
        let headers2 = ["Sl No", "Name of Division", "Inst. Capacity (MVA)"];
        dateRangeArray.forEach(dateStr => {
            const [y, m, d] = dateStr.split("-");
            headers2.push(`${d}/${m}/${y}`);
        });
        csvContent += headers2.join(",") + "\n";

        let totalRegionRangeExcel = {};
        dateRangeArray.forEach(dateStr => { totalRegionRangeExcel[dateStr] = 0; });

        reportData.forEach((div, index) => {
            let row = [index + 1, `"${div.name}"`, div.capacity.toFixed(2)];
            dateRangeArray.forEach(dateStr => {
                const peak = rangeData[div.name][dateStr];
                if (peak && peak.load > 0) {
                    totalRegionRangeExcel[dateStr] += peak.load;
                    row.push(`"${peak.load.toFixed(2)} at ${peak.time}"`);
                } else {
                    row.push("-");
                }
            });
            csvContent += row.join(",") + "\n";
        });

        let totalRowExcel = [`"TOTAL REGION"`, `""`, grandTotalCapacity.toFixed(2)];
        dateRangeArray.forEach(dateStr => {
            const sum = totalRegionRangeExcel[dateStr];
            if (sum > 0) {
                totalRowExcel.push(sum.toFixed(2));
            } else {
                totalRowExcel.push("-");
            }
        });
        csvContent += totalRowExcel.join(",") + "\n";

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Load_Report_${dateRangeArray[0]}_to_${dateRangeArray[dateRangeArray.length-1]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    renderShell();
  </script>
</body>
</html>
