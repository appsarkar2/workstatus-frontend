<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Region Report — WorkStatus</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="app-body">

  <div id="app"></div>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/components.js"></script>

  <script>
    const user = getCurrentUser();
    if (user.role === "division_user") {
      window.location.href = "/puja-load.html";
    }

    const blockApi = BlockAPI("puja_load_demand");
    const app = document.getElementById("app");

    let blockConfig = null;
    let reportData = [];
    let reportDate = "";
    let reportDateFormatted = ""; 
    let reportHour = "";
    let missingDivisions = []; 

    // Define the hours to display
    const displayHours = ["17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];

    // ---------- Render Shell ----------
    function renderShell() {
      const today = new Date().toISOString().split("T")[0];
      
      app.innerHTML = `
        ${header({
          title: "Region Report",
          back: true,
          backUrl: "/puja-load.html"
        })}
        
        <section class="detail-card" style="margin-top: 16px;">
          <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 140px;">
              <label style="font-size: 12px; font-weight: bold; color: var(--color-text-muted);">Date</label>
              <input type="date" id="dateInput" value="${today}" class="modal-input" style="margin-bottom: 0;" />
            </div>
            <div style="flex: 1; min-width: 120px;">
              <label style="font-size: 12px; font-weight: bold; color: var(--color-text-muted);">Hour</label>
              <select id="hourInput" class="modal-input" style="margin-bottom: 0;">
                ${displayHours.map(h => `<option value="${h}">${h} hrs</option>`).join("")}
              </select>
            </div>
            <button class="btn-primary" onclick="loadReport()" style="width: auto; padding: 10px 20px; height: 42px;">View</button>
          </div>
        </section>

        <!-- Added a scrollable div here for mobile viewing -->
        <div id="reportContent" style="overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%;">
          ${emptyState("⏳", "Select a date and click View")}
        </div>
      `;
    }

    // ---------- Load Report ----------
    async function loadReport() {
      const date = document.getElementById("dateInput").value;
      const time = document.getElementById("hourInput").value;
      
      if (!date || !time) { showToast("Please select date and hour", "error"); return; }

      reportDate = date;
      const [y, m, d] = date.split("-");
      reportDateFormatted = `${d}-${m}-${y}`;

      reportHour = time;
      const content = document.getElementById("reportContent");
      content.innerHTML = emptyState("⏳", "Loading report...");

      try {
        if (!blockConfig) blockConfig = await blockApi.getConfig();

        const data = await blockApi.list({ search: date });
        const currEntries = data.items.filter(e => e.date === date);

        const divisionsMap = {};
        missingDivisions = []; 

        blockConfig.divisions.forEach(div => {
           const capacity = div.substations.reduce((sum, s) => sum + s.capacity_mva, 0);
           divisionsMap[div.name] = {
              name: div.name,
              capacity: capacity,
              hours: {} 
           };
        });

        currEntries.forEach(entry => {
           if (divisionsMap[entry.division]) {
               divisionsMap[entry.division].hours[entry.time] = entry;
           }
        });

        reportData = Object.values(divisionsMap);
        
        reportData.forEach(div => {
           let maxLoad = 0;
           let peakHour = "";
           
           displayHours.forEach(h => {
               const entry = div.hours[h];
               if (entry && entry.total_load_mva > maxLoad) {
                   maxLoad = entry.total_load_mva;
                   peakHour = h;
               }
           });
           
           div.peak_load = maxLoad;
           div.peak_hour = peakHour;

           if (!div.hours[reportHour]) {
               missingDivisions.push(div.name);
           }
        });

        renderGrid();
      } catch (e) {
        content.innerHTML = emptyState("⚠️", "Failed to load", e.message);
      }
    }

    // ---------- Render the Grid ----------
    function renderGrid() {
      const content = document.getElementById("reportContent");
      
      let grandTotalCapacity = 0;
      let grandTotalPeak = 0;
      
      const regionHourlyTotals = {};
      displayHours.forEach(h => { regionHourlyTotals[h] = 0; });

      const thStyle = "padding: 8px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 60px; white-space: nowrap;";
      const tdStyle = "padding: 8px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; white-space: normal; word-wrap: break-word; min-width: 60px;";

      // Set a fixed minimum width so the table doesn't squish
      let tableHeaders = `
        <th rowspan="2" style="padding: 8px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f8fafc; min-width: 100px;">Division</th>
        <th rowspan="2" style="${thStyle}">Inst. Capacity<br>(MVA)</th>
        <th rowspan="2" style="${thStyle}">Peak Load<br>(MVA)<br><span style="font-size: 10px; font-weight: normal;">(Time & Date)</span></th>
      `;

      displayHours.forEach(h => {
        tableHeaders += `<th colspan="2" style="padding: 6px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #e2e8f0; font-size: 12px; white-space: nowrap;">${h}</th>`;
      });

      let subHeaders = `<tr>`;
      displayHours.forEach(h => {
        subHeaders += `
          <th style="padding: 4px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f1f5f9; font-size: 10px; width: 50px;">Load</th>
          <th style="padding: 4px; text-align: center; vertical-align: middle; border: 1px solid #cbd5e1; background: #f1f5f9; font-size: 10px; width: 50px;">%</th>
        `;
      });
      subHeaders += `</tr>`;

      let tableRows = reportData.map(div => {
        grandTotalCapacity += div.capacity;
        grandTotalPeak += div.peak_load;

        let rowHtml = `
          <tr>
            <td style="padding: 8px; border: 1px solid #cbd5e1; font-weight: bold; text-align: left; vertical-align: middle; min-width: 100px; white-space: nowrap;">${escapeHtml(div.name)}</td>
            <td style="${tdStyle}">${div.capacity.toFixed(2)}</td>
            
            <td style="${tdStyle} min-width: 120px;">
                ${div.peak_load > 0 
                  ? `<div style="font-weight: bold; font-size: 14px;">${div.peak_load.toFixed(2)}</div>
                     <div style="font-size: 11px; color: #64748b; white-space: nowrap;">at ${div.peak_hour} on ${reportDateFormatted}</div>` 
                  : "—"}
            </td>
        `;

        displayHours.forEach(h => {
           const entry = div.hours[h];
           if (entry) {
              const pct = ((entry.total_load_mva / div.capacity) * 100).toFixed(1);
              regionHourlyTotals[h] += entry.total_load_mva; 
              
              rowHtml += `
                <td style="${tdStyle}">${entry.total_load_mva.toFixed(2)}</td>
                <td style="${tdStyle} color: #64748b;">${pct}%</td>
              `;
           } else {
              rowHtml += `
                <td style="${tdStyle} color: #cbd5e1;">-</td>
                <td style="${tdStyle} color: #cbd5e1;">-</td>
              `;
           }
        });

        rowHtml += `</tr>`;
        return rowHtml;
      }).join("");

      let totalRowHourlyHtml = "";
      displayHours.forEach(h => {
          const load = regionHourlyTotals[h];
          if (load > 0) {
              const pct = ((load / grandTotalCapacity) * 100).toFixed(1);
              totalRowHourlyHtml += `
                <td style="${tdStyle}">${load.toFixed(2)}</td>
                <td style="${tdStyle} color: #64748b;">${pct}%</td>
              `;
          } else {
              totalRowHourlyHtml += `
                <td style="${tdStyle} color: #cbd5e1;">-</td>
                <td style="${tdStyle} color: #cbd5e1;">-</td>
              `;
          }
      });

      content.innerHTML = `
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px;">
          <h2 class="section-title" style="margin: 0;">Division-wise Hourly System Load-Darjeeling Region</h2>
          <button class="btn-primary" onclick="downloadPDF()" style="width: auto; padding: 8px 16px; background: #dc2626;">📄 Download PDF</button>
        </div>

        <!-- Added min-width to the table so it forces the scrollbar on mobile -->
        <table style="width: 100%; min-width: 1200px; border-collapse: collapse; font-size: 12px; background: #fff; table-layout: auto;">
          <thead>
            <tr>${tableHeaders}</tr>
            ${subHeaders}
          </thead>
          <tbody>
            ${tableRows}
            <tr style="background: #f8fafc; font-weight: bold;">
              <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: left; vertical-align: middle; min-width: 100px;">TOTAL REGION</td>
              <td style="${tdStyle}">${grandTotalCapacity.toFixed(2)}</td>
              <td style="${tdStyle}">${grandTotalPeak.toFixed(2)}</td>
              ${totalRowHourlyHtml}
            </tr>
          </tbody>
        </table>
      `;
    }

    // ---------- Check Data & Download PDF ----------
    async function downloadPDF() {
      if (missingDivisions.length > 0) {
        const confirmMsg = `The following divisions have not entered data for ${reportHour} hrs:\n\n${missingDivisions.join(", ")}\n\nDo you still want to download the report?`;
        
        const proceed = await showConfirm({
          title: "Missing Data",
          message: confirmMsg,
          confirmText: "Yes, Download",
          cancelText: "Cancel"
        });

        if (!proceed) return; 
      }

      generatePDF();
    }

    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();

      // Main Title (Centered)
      doc.setFontSize(16);
      doc.setTextColor(30, 64, 175); 
      doc.setFont("helvetica", "bold");
      doc.text(`Division-wise Hourly System Load-Darjeeling Region`, pageWidth / 2, 20, { align: 'center' });
      
      // Subtitle (Date) - Bold and Centered
      doc.setFontSize(11);
      doc.setTextColor(15, 23, 42); 
      doc.setFont("helvetica", "normal");
      doc.text(`Date: ${reportDateFormatted}`, pageWidth / 2, 27, { align: 'center' });

      let head = [
        [
          { content: 'Division', rowSpan: 2 },
          { content: 'Inst. Cap\n(MVA)', rowSpan: 2 },
          { content: 'Peak Load\n(Time & Date)', rowSpan: 2 }
        ],
        []
      ];

      displayHours.forEach(h => {
        head[0].push({ 
          content: h, 
          colSpan: 2, 
          styles: { halign: 'center', fillColor: [219, 234, 254], textColor: [30, 64, 175], fontStyle: 'bold' } 
        });
        head[1].push({ content: 'Load', styles: { halign: 'center', fontSize: 9 } });
        head[1].push({ content: '%', styles: { halign: 'center', fontSize: 9 } });
      });

      const body = reportData.map(div => {
         let peakStr = "-";
         if (div.peak_load > 0) {
             peakStr = `${div.peak_load.toFixed(2)}\n(at ${div.peak_hour} on ${reportDateFormatted})`;
         }

         let row = [
            { content: div.name, styles: { fontStyle: 'bold', halign: 'left' } },
            div.capacity.toFixed(2),
            peakStr
         ];
         
         displayHours.forEach(h => {
            const entry = div.hours[h];
            if (entry) {
                const pct = ((entry.total_load_mva / div.capacity) * 100).toFixed(1);
                row.push(entry.total_load_mva.toFixed(2));
                row.push(pct + "%");
            } else {
                row.push("-");
                row.push("-");
            }
         });
         return row;
      });

      const regionHourlyTotals = {};
      displayHours.forEach(h => { regionHourlyTotals[h] = 0; });
      
      let grandTotalCapacity = 0;
      reportData.forEach(div => {
         grandTotalCapacity += div.capacity;
         displayHours.forEach(h => {
            const entry = div.hours[h];
            if (entry) regionHourlyTotals[h] += entry.total_load_mva;
         });
      });

      let totalRow = [
         { content: "TOTAL REGION", styles: { fontStyle: 'bold', halign: 'left' } },
         { content: grandTotalCapacity.toFixed(2), styles: { fontStyle: 'bold' } },
         { content: "—", styles: { fontStyle: 'bold' } } 
      ];
      
      displayHours.forEach(h => {
         const load = regionHourlyTotals[h];
         if (load > 0) {
             const pct = ((load / grandTotalCapacity) * 100).toFixed(1);
             totalRow.push({ content: load.toFixed(2), styles: { fontStyle: 'bold' } });
             totalRow.push({ content: pct + "%", styles: { fontStyle: 'bold' } });
         } else {
             totalRow.push({ content: "-", styles: { fontStyle: 'bold' } });
             totalRow.push({ content: "-", styles: { fontStyle: 'bold' } });
         }
      });
      
      body.push(totalRow);

      doc.autoTable({
        startY: 33,
        head: head,
        body: body,
        theme: 'grid',
        styles: { 
          fontSize: 8.5, 
          cellPadding: 3, 
          halign: 'center', 
          valign: 'middle',
          textColor: [15, 23, 42], 
          lineColor: [203, 213, 225], 
          lineWidth: 0.1
        },
        headStyles: { 
          fillColor: [241, 245, 249], 
          textColor: [15, 23, 42],
          fontStyle: 'bold'
        },
        columnStyles: {
          0: { minCellWidth: 35 },
          2: { minCellWidth: 35 } 
        },
        alternateRowStyles: {
          fillColor: [248, 250, 252]
        },
        margin: { top: 33, left: 14, right: 14 },
        pageBreak: 'avoid'
      });

      doc.save(`Division_wise_Load_${reportDateFormatted}.pdf`);
    }

    // ---------- Init ----------
    renderShell();
  </script>
</body>
</html>
