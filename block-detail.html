<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Dashboard — WorkStatus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  
  <style>
    :root {
        --bg-main: #f4f7f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
        --primary: #3b82f6; --primary-light: #eff6ff; --success: #10b981; --warning: #f59e0b;
        --danger: #ef4444; --border: #e2e8f0; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body { background-color: var(--bg-main); font-family: 'Inter', -apple-system, sans-serif; margin: 0; min-height: 100vh; color: var(--text-main); }
    .app-container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-title h1 { font-size: 28px; font-weight: 800; margin: 0; }
    .page-title p { font-size: 14px; color: var(--text-muted); margin: 4px 0 0 0; }
    .header-actions { display: flex; gap: 12px; }
    .btn { padding: 12px 24px; border-radius: 10px; font-weight: 700; text-decoration: none; transition: 0.2s; cursor: pointer; border: none; font-size: 14px; }
    .btn-back { background: white; color: var(--text-main); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .btn-back:hover { background: #f8fafc; }
    .btn-new { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .btn-new:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-danger { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
    .btn-danger:hover { background: #dc2626; transform: translateY(-1px); }
    .filters-card { background: white; border-radius: 16px; padding: 20px 24px; border: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; gap: 20px; margin-bottom: 30px; align-items: flex-end; }
    .filter-group { flex: 1; }
    .filter-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .filter-select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; background: #f8fafc; cursor: pointer; transition: 0.2s; }
    .filter-select:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px var(--primary-light); }
    .filter-select:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
    .section-header { display: flex; align-items: center; gap: 10px; margin-top: 30px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .section-header h2 { font-size: 20px; font-weight: 800; margin: 0; color: var(--text-main); }
    .section-header .badge-total { background: var(--primary-light); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 800; }
    .stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    
    .stage-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .stage-card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px -5px rgba(0,0,0,0.1); }
    .stage-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; z-index: 1; }
    .stage-num { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 4px 8px; border-radius: 6px; }
    .stage-count { font-size: 32px; font-weight: 900; line-height: 1; z-index: 1; }
    .stage-title { font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1.4; z-index: 1; margin-top: 8px; }
    
    .sla-badge-red { margin-top: 10px; font-size: 12px; font-weight: 700; color: #b91c1c; background: #fee2e2; padding: 4px 8px; border-radius: 6px; display: inline-block; }
    .sla-badge-green { margin-top: 10px; font-size: 12px; font-weight: 700; color: #15803d; background: #dcfce7; padding: 4px 8px; border-radius: 6px; display: inline-block; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; z-index: 9999; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.show { display: block; opacity: 1; }
    .modal-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); background: var(--card-bg); border-radius: 20px; padding: 0; z-index: 10000; width: 90%; max-width: 900px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-height: 90vh; display: flex; flex-direction: column; transition: transform 0.2s; }
    .modal-overlay.show .modal-box { transform: translate(-50%, -50%) scale(1); }
    .modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 20px 20px 0 0; }
    .modal-title { font-size: 20px; font-weight: 800; margin: 0; color: var(--text-main); }
    .modal-close { background: white; border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: #f1f5f9; color: var(--text-main); }
    .modal-body { padding: 0; overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th, td { border-bottom: 1px solid var(--border); padding: 16px 24px; text-align: center; vertical-align: middle; }
    th { background: white; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; position: sticky; top: 0; }
    .row-clickable { cursor: pointer; transition: 0.2s; }
    .row-clickable:hover { background: #f8fafc; }
    .btn-delete { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; transition: 0.2s; }
    .btn-delete:hover { background: #dc2626; color: white; }
    @media (max-width: 768px) { .page-header { flex-direction: column; align-items: flex-start; gap: 15px; } .filters-card { flex-direction: column; gap: 15px; } .stage-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="app-body">

  <div id="app"></div>

  <div id="listModal" class="modal-overlay" onclick="closeListModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
          <div class="modal-header">
              <h3 class="modal-title" id="modalTitle">Applications</h3>
              <button class="modal-close" onclick="closeListModal()">✕</button>
          </div>
          <div class="modal-body">
              <table>
                  <thead>
                      <tr>
                          <th style="text-align: left;">App No</th>
                          <th style="text-align: left;">Applicant Details</th>
                          <th style="text-align: left;">Location</th>
                          <th>Delay</th>
                          <th>Action</th>
                      </tr>
                  </thead>
                  <tbody id="modalTableBody"></tbody>
              </table>
          </div>
      </div>
  </div>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/components.js"></script>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const blockId = params.get("block") || "bulk_connection";
    
    let STAGES = [];
    let isCivilWork = blockId === "civil_work";
    let isElectrical = blockId === "electrical_works";

    if (isCivilWork) {
        STAGES = ["Inception", "Proposal", "Estimation", "Funding", "Approval & T&AA", "Tendering", "PO Placement", "Site Handover", "Completion", "Financial Closure"];
    } else if (isElectrical) {
        STAGES = ["Application Received & Site Verification", "Technical Feasibility & Estimation", "Work Order & Budget Approval", "Material Procurement", "Execution & Installation", "Testing, Handover & Closure"];
    } else {
        STAGES = ["App. Received & Doc. Verification", "Physical Inspection & Tech. Feasibility", "Quotation Served", "Deposition of Quotation Amount", "Work Order & PO Generation", "Agreement Execution", "Work Completion Report", "Consumer Outgoing Ready", "EI Approval Submission", "Commercial Clearance", "Meter Installation", "Meter Report Submission", "Master Card Creation"];
    }

    const blockApi = BlockAPI(blockId);
    const app = document.getElementById("app");
    
    const user = getCurrentUser();
    const isAdmin = ["super_admin", "admin"].includes(user.role);
    const isHR = (user.username || "").toLowerCase() === "dro_h&r" || user.role === "hr_user";

    let rawApplications = [];
    let orgData = {};
    let stageSlaData = {}; 
    
    let filterZone = "";
    let filterRegion = "";
    let filterDivision = "";

    async function loadData() {
      try {
        const promises = [
          blockApi.list(),
          apiFetch("/api/org-structure").catch(() => ({ zones: {} }))
        ];
        
        if (!isCivilWork) {
            promises.push(apiFetch(`/api/blocks/${blockId}/sla-summary`).catch(() => ({})));
        }

        const results = await Promise.all(promises);
        rawApplications = results[0].items || [];
        orgData = results[1] || { zones: {} };
        
        if (results[2]) {
            stageSlaData = results[2];
        }

        renderDashboard();
      } catch (e) {
        app.innerHTML = `<div style="text-align: center; padding: 50px; color: red;">Error: ${e.message}</div>`;
      }
    }

    function showSLAReport() {
        window.location.href = `/sla-report.html?block=${blockId}`;
    }

    function onFilterChange() {
        filterZone = document.getElementById("filterZone").value;
        filterRegion = document.getElementById("filterRegion").value;
        filterDivision = document.getElementById("filterDivision").value;
        renderDashboard();
    }

    function updateFilterRegions() {
        const zone = document.getElementById("filterZone").value;
        const regSelect = document.getElementById("filterRegion");
        const divSelect = document.getElementById("filterDivision");
        regSelect.innerHTML = `<option value="">All Regions</option>`;
        divSelect.innerHTML = `<option value="">All Divisions</option>`;
        divSelect.disabled = true;
        if (zone && orgData.zones && orgData.zones[zone]) {
            Object.keys(orgData.zones[zone].regions).forEach(r => { regSelect.innerHTML += `<option value="${r}">${r}</option>`; });
            regSelect.disabled = false;
        } else { regSelect.disabled = true; }
        onFilterChange();
    }

    function updateFilterDivisions() {
        const zone = document.getElementById("filterZone").value;
        const region = document.getElementById("filterRegion").value;
        const divSelect = document.getElementById("filterDivision");
        divSelect.innerHTML = `<option value="">All Divisions</option>`;
        if (zone && region && orgData.zones && orgData.zones[zone] && orgData.zones[zone].regions[region]) {
            Object.keys(orgData.zones[zone].regions[region]).forEach(d => { divSelect.innerHTML += `<option value="${d}">${d}</option>`; });
            divSelect.disabled = false;
        } else { divSelect.disabled = true; }
        onFilterChange();
    }

    function buildStageCard(i, stageName, count) {
        if (count === 0) {
            return `
            <div class="stage-card" onclick="showStageApps(${i}, '${escapeHtml(stageName)}', false)" style="opacity: 0.6; border: 1px dashed #cbd5e1; background: #f8fafc;">
                <div>
                    <div class="stage-header"><span class="stage-num" style="background:#f1f5f9; color:#64748b;">Stage ${i}</span><span class="stage-count" style="color:#94a3b8;">0</span></div>
                    <div class="stage-title">${stageName}</div>
                </div>
            </div>`;
        }

        const slaInfo = stageSlaData[i] || { breached: 0, total_delay: 0 };
        const hasBreaches = slaInfo.breached > 0;

        const cardStyle = hasBreaches 
            ? "background: #fef2f2; border-color: #fca5a5; box-shadow: 0 4px 12px rgba(239,68,68,0.15);" 
            : "background: #f0fdf4; border-color: #86efac; box-shadow: 0 4px 12px rgba(34,197,94,0.15);";
            
        const textStyle = hasBreaches ? "color: #991b1b;" : "color: #166534;";
        const badgeStyle = hasBreaches ? "background:#fee2e2; color:#991b1b;" : "background:#dcfce7; color:#166534;";

        const slaSummary = hasBreaches 
            ? `<div class="sla-badge-red">⚠️ ${slaInfo.breached} applications presently delayed</div>`
            : `<div class="sla-badge-green">✅ On Track</div>`;

        return `
            <div class="stage-card" onclick="showStageApps(${i}, '${escapeHtml(stageName)}', ${hasBreaches})" style="${cardStyle}">
                <div>
                    <div class="stage-header">
                        <span class="stage-num" style="${badgeStyle}">Stage ${i}</span>
                        <span class="stage-count" style="${textStyle}">${count}</span>
                    </div>
                    <div class="stage-title">${stageName}</div>
                </div>
                <div>${slaSummary}</div>
            </div>
        `;
    }

    function renderDashboard() {
      let filteredApps = rawApplications.filter(a => {
          let match = true;
          if (filterZone && a.zone !== filterZone) match = false;
          if (filterRegion && a.region !== filterRegion) match = false;
          if (filterDivision && a.division !== filterDivision) match = false;
          return match;
      });

      let stageCounts = {};
      for (let i = 1; i <= STAGES.length; i++) stageCounts[i] = 0;
      filteredApps.forEach(a => {
          if (a.status === 'in_progress' && a.current_stage >= 1 && a.current_stage <= STAGES.length) {
              stageCounts[a.current_stage] = (stageCounts[a.current_stage] || 0) + 1;
          }
      });

      let pendingAppCards = "";
      let pendingAppTotal = 0;
      
      let splitPoint = isHR ? 1 : (isCivilWork ? 5 : 3);
      
      for (let i = 1; i <= splitPoint; i++) {
          const count = stageCounts[i];
          pendingAppTotal += count;
          pendingAppCards += buildStageCard(i, STAGES[i-1], count);
      }

      let pendingConnCards = "";
      let pendingConnTotal = 0;
      
      if (!isHR) {
          for (let i = splitPoint + 1; i <= STAGES.length; i++) {
              const count = stageCounts[i];
              pendingConnTotal += count;
              pendingConnCards += buildStageCard(i, STAGES[i-1], count);
          }
      }

      const slaButton = (isAdmin && !isCivilWork) ? `<button class="btn btn-danger" onclick="showSLAReport()">🚨 View Full SLA Report</button>` : '';
      
      // Dynamic Title and Button Text
      const blockTitle = isCivilWork ? 'Civil Work' : (isElectrical ? 'Electrical Works' : 'Bulk Connection');
      const itemName = isCivilWork ? 'Project' : (isElectrical ? 'Scheme' : 'Application');
      const newFormUrl = `/${blockId === 'electrical_works' ? 'electrical' : 'bulk'}-new.html?block=${blockId}`;

      app.innerHTML = `
        <div class="app-container">
            <div class="page-header">
                <div class="page-title">
                    <h1>${blockTitle} Dashboard</h1>
                    <p>${isHR ? 'HR View - Stage 1 Verification' : 'Stage-wise pendency report'}</p>
                </div>
                <div class="header-actions">
                    <a href="/dashboard.html" class="btn btn-back">← Back to App</a>
                    ${slaButton}
                    <button class="btn btn-new" onclick="window.location.href='${newFormUrl}'">+ New ${itemName}</button>
                </div>
            </div>

            <div class="filters-card">
                <div class="filter-group">
                    <label>Zone</label>
                    <select id="filterZone" class="filter-select" onchange="updateFilterRegions()">
                        <option value="">All Zones</option>
                        ${orgData.zones ? Object.keys(orgData.zones).map(z => `<option value="${z}">${z}</option>`).join('') : ''}
                    </select>
                </div>
                <div class="filter-group">
                    <label>Region</label>
                    <select id="filterRegion" class="filter-select" onchange="updateFilterDivisions()" disabled><option value="">All Regions</option></select>
                </div>
                <div class="filter-group">
                    <label>Division</label>
                    <select id="filterDivision" class="filter-select" onchange="onFilterChange()" disabled><option value="">All Divisions</option></select>
                </div>
            </div>

            <div class="section-header"><h2>Pending ${itemName}s</h2><span class="badge-total">${pendingAppTotal} Total</span></div>
            <div class="stage-grid">${pendingAppCards}</div>

            ${!isHR ? `
            <div class="section-header"><h2>Pending ${isCivilWork ? 'Execution' : (isElectrical ? 'Execution' : 'Connections')}</h2><span class="badge-total">${pendingConnTotal} Total</span></div>
            <div class="stage-grid">${pendingConnCards}</div>
            ` : ''}
        </div>
      `;
    }

    async function showStageApps(stageNo, stageName, hasBreaches) {
        document.querySelector("#listModal thead").style.display = "table-header-group";
        document.getElementById("modalTitle").innerHTML = `Loading Stage ${stageNo}...`;
        document.getElementById("modalTableBody").innerHTML = `<tr><td colspan="5" style="padding: 40px; text-align:center;">Fetching applications...</td></tr>`;
        document.getElementById("listModal").classList.add("show");

        try {
            const response = await apiFetch(`/api/blocks/${blockId}/stage-apps?stage_no=${stageNo}`);
            let appsInStage = response.items || [];
            
            let modalTitle = `Stage ${stageNo}: ${stageName} (${appsInStage.length})`;
            
            if (hasBreaches) {
                const slaInfo = stageSlaData[stageNo] || { breached: 0, total_delay: 0 };
                modalTitle += ` - <span style="color: #ef4444; font-size: 14px;">⚠️ ${slaInfo.breached} Breached (${slaInfo.total_delay} Days)</span>`;
            }

            document.getElementById("modalTitle").innerHTML = modalTitle;
            
            // Update Table Headers dynamically for Electrical
            const thead = document.querySelector("#listModal thead tr");
            if (isElectrical) {
                thead.innerHTML = `
                    <th style="text-align: left;">Scheme No</th>
                    <th style="text-align: left;">Scheme Details</th>
                    <th style="text-align: left;">Location</th>
                    <th>Delay</th>
                    <th>Action</th>
                `;
            } else {
                thead.innerHTML = `
                    <th style="text-align: left;">App No</th>
                    <th style="text-align: left;">Applicant Details</th>
                    <th style="text-align: left;">Location</th>
                    <th>Delay</th>
                    <th>Action</th>
                `;
            }

            const myAllowedStages = {
                "hr_user": [1], "dro_h&r": [1], "commerce_manager_1": [2, 3, 4, 5, 6], "commerce_manager_2": [5, 6, 7, 8],
                "finance_user": [3], "dro_finance": [3], "commerce_manager_3": [9, 10, 11, 12, 13]
            }[(user.username || "").toLowerCase()] || [];
            
            const canDeleteInThisStage = isAdmin || myAllowedStages.includes(stageNo);
            
            let rowsHtml = appsInStage.map(a => {
                const appName = isElectrical ? (a.scheme_name || "Unknown Scheme") : (a.applicant?.name || "Unknown");
                const appContact = isElectrical ? (a.scheme_head || "—") : (a.applicant?.contact || "—");
                const divName = a.division || "Unassigned";
                const subStation = a.substation || "—";
                const appNo = a.application_no || a.project_no || "—";
                
                const isThisAppBreached = a.is_breached;
                const delayDays = a.delay_days;
                
                const rowStyle = isThisAppBreached ? "background-color: #fef2f2;" : "";
                
                const delayHtml = isThisAppBreached 
                    ? `<span style="color:#ef4444; font-weight:800; font-size:14px;">${delayDays} Days</span>` 
                    : `<span style="color:#10b981; font-weight:600;">On Time</span>`;

                const deleteBtn = canDeleteInThisStage 
                    ? `<button class="btn-delete" onclick="deleteApp(event, '${a._id}', '${appNo}')">🗑️ Delete</button>` 
                    : ``;

                return `
                    <tr class="row-clickable" onclick="window.location.href='/application-detail.html?block=${blockId}&id=${a._id}'" style="${rowStyle}">
                        <td style="text-align: left; font-weight: 800; color: var(--primary);">${appNo}</td>
                        <td style="text-align: left; font-weight: 600;">${appName}<br><span style="font-size: 11px; color: var(--text-muted); font-weight: 400;">${appContact}</span></td>
                        <td style="text-align: left; font-size: 12px;">${divName}<br><span style="color:var(--text-muted); font-size: 11px;">${subStation}</span></td>
                        <td>${delayHtml}</td>
                        <td>${deleteBtn}</td>
                    </tr>
                `;
            }).join("");

            document.getElementById("modalTableBody").innerHTML = rowsHtml || `<tr><td colspan="5" style="padding: 40px; color: var(--text-muted); font-weight: 600;">✅ No items pending in this stage.</td></tr>`;
            
        } catch (e) {
            document.getElementById("modalTableBody").innerHTML = `<tr><td colspan="5" style="padding: 40px; color: red; text-align:center;">Error: ${e.message}</td></tr>`;
        }
    }

    async function deleteApp(event, appId, appNo) {
        event.stopPropagation();
        const confirmMsg = `Are you sure you want to permanently delete ${appNo}?\n\nThis action cannot be undone.`;
        if (!confirm(confirmMsg)) return;

        try {
            await apiFetch(`/api/blocks/${blockId}/${appId}`, { method: 'DELETE' });
            showToast("Deleted successfully", "success");
            rawApplications = rawApplications.filter(a => a._id !== appId);
            renderDashboard();
            closeListModal();
        } catch (err) {
            showToast(err.message || "Failed to delete", "error");
        }
    }

    function closeListModal() { document.getElementById("listModal").classList.remove("show"); }

    loadData();
  </script>
</body>
</html>
