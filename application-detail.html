<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Details — WorkStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  
  <style>
    :root {
        --bg-main: #f8fafc; 
        --card-bg: #ffffff; 
        --text-main: #0f172a; 
        --text-muted: #64748b;
        --primary: #3b82f6; 
        --primary-light: #eff6ff; 
        --success: #10b981; 
        --danger: #ef4444; 
        --border: #cbd5e1; 
    }
    * { box-sizing: border-box; }
    body { background-color: var(--bg-main); font-family: 'Inter', -apple-system, sans-serif; margin: 0; min-height: 100vh; color: var(--text-main); }
    .app-container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }

    /* Header Buttons */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); }
    .page-title h1 { font-size: 22px; font-weight: 800; margin: 0; color: var(--text-main); }
    .page-title p { font-size: 14px; color: var(--text-muted); margin: 4px 0 0 0; }
    
    .header-actions { display: flex; gap: 10px; }
    .btn { border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; transition: 0.2s; }
    .btn-back { background: #f1f5f9; color: var(--text-main); }
    .btn-edit { background: var(--primary); color: white; }
    .btn-delete { background: var(--danger); color: white; }

    /* Tables */
    .table-container { background: white; border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: center; vertical-align: middle; }
    th { background: #f8fafc; font-weight: 800; color: var(--text-main); }
    .bg-light { background: #f1f5f9; }

    .section-title { font-size: 16px; font-weight: 800; margin: 0 0 15px 0; text-align: center; padding-top: 15px; }

    /* Stepper Progress in Table Format */
    .stage-done { color: var(--success); font-weight: 800; }
    .stage-active { color: var(--primary); font-weight: 800; }
    .stage-pending { color: var(--text-muted); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; z-index: 9999; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.show { display: block; opacity: 1; }
    .modal-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); background: var(--card-bg); border-radius: 12px; padding: 30px; z-index: 10000; width: 100%; max-width: 650px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; transition: transform 0.2s; }
    .modal-overlay.show .modal-box { transform: translate(-50%, -50%) scale(1); }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .input-field { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); font-size: 14px; font-family: 'Inter', sans-serif; }
    .input-field:focus { outline: none; border-color: var(--primary); background: white; }
    .input-field:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
    
    .demand-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    @media (max-width: 768px) { .demand-grid { grid-template-columns: 1fr 1fr; } .page-header { flex-direction: column; align-items: flex-start; gap: 15px; } }
  </style>
</head>
<body>

  <div id="app"></div>

  <!-- Edit Application Modal -->
  <div id="editModal" class="modal-overlay" onclick="closeEditModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
          <h2 style="font-size: 20px; margin-top: 0; margin-bottom: 20px;">Edit Application Details</h2>
          
          <div class="input-group">
              <label>Zone</label>
              <select id="editZone" class="input-field" onchange="updateRegions()">
                  <option value="" disabled selected>Select Zone...</option>
              </select>
          </div>

          <div class="input-group">
              <label>Region</label>
              <select id="editRegion" class="input-field" onchange="updateDivisions()" disabled>
                  <option value="">Select Zone first...</option>
              </select>
          </div>

          <div class="input-group">
              <label>Division</label>
              <select id="editDivision" class="input-field" onchange="updateSubStations()" disabled>
                  <option value="">Select Region first...</option>
              </select>
          </div>

          <div class="input-group">
              <label>Sub-station</label>
              <select id="editSubstation" class="input-field" disabled>
                  <option value="">Select Division first...</option>
              </select>
          </div>

          <div class="input-group">
              <label>Type</label>
              <select id="editType" class="input-field" onchange="toggleCustomType()">
                  <option value="LT">LT</option>
                  <option value="11 KV HT">11 KV HT</option>
                  <option value="33 KV HT">33 KV HT</option>
                  <option value="SOLAR">SOLAR</option>
                  <option value="PROCEDURE-B">PROCEDURE-B</option>
                  <option value="Under Specify">Under Specify</option>
              </select>
          </div>

          <div class="input-group" id="customTypeGroup" style="display: none;">
              <label>Enter Custom Type</label>
              <input id="editCustomType" type="text" class="input-field" placeholder="Please specify..." />
          </div>

          <div class="input-group">
              <label>Address</label>
              <input id="editAddress" type="text" class="input-field" placeholder="Full address" />
          </div>

          <div style="background: var(--bg-main); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px;">
              <label style="display: block; font-size: 13px; font-weight: 800; margin-bottom: 10px;">Proposed Contract Demand (KVA)</label>
              <div class="demand-grid">
                  <div><label style="font-size: 11px; color: var(--text-muted);">1st Yr.</label><input id="editDemand1st" type="number" class="input-field" /></div>
                  <div><label style="font-size: 11px; color: var(--text-muted);">2nd Yr.</label><input id="editDemand2nd" type="number" class="input-field" /></div>
                  <div><label style="font-size: 11px; color: var(--text-muted);">3rd Yr.</label><input id="editDemand3rd" type="number" class="input-field" /></div>
                  <div><label style="font-size: 11px; color: var(--text-muted);">4th Yr.</label><input id="editDemand4th" type="number" class="input-field" /></div>
                  <div><label style="font-size: 11px; color: var(--text-muted);">5th Yr.</label><input id="editDemand5th" type="number" class="input-field" /></div>
              </div>
          </div>
          
          <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
              <button onclick="closeEditModal()" class="btn" style="background: #f1f5f9; color: var(--text-main);">Cancel</button>
              <button onclick="saveEdit()" class="btn btn-edit">Save Changes</button>
          </div>
      </div>
  </div>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/components.js"></script>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const blockId = params.get("block") || "bulk_connection";
    const appId   = params.get("id");
    
    if (!appId) window.location.href = "/dashboard.html";

    const blockApi = BlockAPI(blockId);
    const app = document.getElementById("app");

    let currentApp = null;
    let orgData = {};

    async function loadData() {
      try {
        const [appData, orgStructure] = await Promise.all([
            blockApi.getOne(appId),
            apiFetch("/api/org-structure")
        ]);
        currentApp = appData;
        orgData = orgStructure;
        renderDashboard();
      } catch (e) {
        app.innerHTML = `<div style="text-align: center; padding: 50px; color: red;">Error: ${e.message}</div>`;
      }
    }

    function renderDashboard() {
      const e = currentApp;
      
      // Calculate table grid data
      const demandFields = [
        e.proposed_demand_1st, e.proposed_demand_2nd, e.proposed_demand_3rd, 
        e.proposed_demand_4th, e.proposed_demand_5th
      ];

      app.innerHTML = `
        <div class="app-container">
            
            <!-- Header -->
            <div class="page-header">
                <div class="page-title">
                    <h1>${e.application_no} — ${e.applicant ? e.applicant.name : "Unknown"}</h1>
                    <p>Created on ${formatDate(e.created_at)} | Status: ${e.status.toUpperCase()}</p>
                </div>
                <div class="header-actions">
                    ${renderActionButtons(e)}
                    <a href="/block-detail.html?block=${blockId}" class="btn btn-back">← Back to List</a>
                </div>
            </div>

            <!-- Section 1: General Information -->
            <h3 class="section-title">Application Details</h3>
            <div class="table-container">
                <table>
                    <tbody>
                        <tr>
                            <th style="width: 20%;">Applicant Name</th>
                            <td style="text-align: left; font-weight: bold;">${e.applicant?.name || "—"}</td>
                            <th style="width: 20%;">Contact</th>
                            <td style="text-align: left;">${e.applicant?.contact || "—"}</td>
                        </tr>
                        <tr>
                            <th>Division</th>
                            <td style="text-align: left;">${e.division || "—"}</td>
                            <th>Sub-station</th>
                            <td style="text-align: left;">${e.substation || "—"}</td>
                        </tr>
                        <tr>
                            <th>Type</th>
                            <td style="text-align: left;">${e.applicant?.type || "—"}</td>
                            <th>Address</th>
                            <td style="text-align: left;">${e.applicant?.address || "—"}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Section 2: Proposed Demand Table -->
            <h3 class="section-title">Proposed Contract Demand (KVA)</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>1st Year</th>
                            <th>2nd Year</th>
                            <th>3rd Year</th>
                            <th>4th Year</th>
                            <th>5th Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            ${demandFields.map(d => `<td style="font-weight: bold; font-size: 16px; color: var(--primary);">${d || "—"}</td>`).join("")}
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Section 3: Workflow Progress Table -->
            <h3 class="section-title">Workflow Progress</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 10%;">Stage</th>
                            <th style="text-align: left;">Stage Name</th>
                            <th>Status</th>
                            <th>Completed By</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(e.stages || []).map(s => {
                            let statusHtml = "";
                            if (s.status === "completed") statusHtml = `<span class="stage-done">✓ Completed</span>`;
                            else if (s.status === "in_progress") statusHtml = `<span class="stage-active">⏳ In Progress</span>`;
                            else statusHtml = `<span class="stage-pending">Pending</span>`;

                            return `
                                <tr>
                                    <td class="bg-light" style="font-weight: bold;">${s.stage_no}</td>
                                    <td style="text-align: left; font-weight: bold;">${escapeHtml(s.name)}</td>
                                    <td>${statusHtml}</td>
                                    <td>${s.completed_by ? escapeHtml(s.completed_by) : "—"}</td>
                                    <td>${s.completed_at ? formatDate(s.completed_at) : "—"}</td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>

        </div>
      `;
    }

    function renderActionButtons(app) {
        const user = getCurrentUser();
        let html = "";

        if (user.role === "admin" || user.role === "super_admin") {
            html += `<button class="btn btn-delete" onclick="deleteApplication()">Delete</button>`;
            html += `<button class="btn btn-edit" onclick="openEditModal()">Edit Details</button>`;
        } 
        else if (user.role === "manager") {
            const editCount = app.edit_count || 0;
            if (editCount < 2) {
                html += `<button class="btn btn-edit" onclick="openEditModal()">Edit Details</button>`;
            }
        }

        return html;
    }

    // --- Cascading Dropdown Logic for Edit Modal ---
    function populateZones() {
        const zoneSelect = document.getElementById("editZone");
        zoneSelect.innerHTML = `<option value="" disabled selected>Select Zone...</option>`;
        Object.keys(orgData.zones).forEach(z => {
            zoneSelect.innerHTML += `<option value="${z}">${z}</option>`;
        });
    }

    function updateRegions() {
        const zone = document.getElementById("editZone").value;
        const regSelect = document.getElementById("editRegion");
        regSelect.innerHTML = `<option value="" disabled selected>Select Region...</option>`;
        
        if (zone && orgData.zones[zone]) {
            Object.keys(orgData.zones[zone].regions).forEach(r => {
                regSelect.innerHTML += `<option value="${r}">${r}</option>`;
            });
            regSelect.disabled = false;
        }
        
        document.getElementById("editDivision").innerHTML = `<option value="">Select Region first...</option>`;
        document.getElementById("editDivision").disabled = true;
        document.getElementById("editSubstation").innerHTML = `<option value="">Select Division first...</option>`;
        document.getElementById("editSubstation").disabled = true;
    }

    function updateDivisions() {
        const zone = document.getElementById("editZone").value;
        const region = document.getElementById("editRegion").value;
        const divSelect = document.getElementById("editDivision");
        
        divSelect.innerHTML = `<option value="" disabled selected>Select Division...</option>`;
        
        if (zone && region && orgData.zones[zone].regions[region]) {
            Object.keys(orgData.zones[zone].regions[region]).forEach(d => {
                divSelect.innerHTML += `<option value="${d}">${d}</option>`;
            });
            divSelect.disabled = false;
        }

        document.getElementById("editSubstation").innerHTML = `<option value="">Select Division first...</option>`;
        document.getElementById("editSubstation").disabled = true;
    }

    function updateSubStations() {
        const zone = document.getElementById("editZone").value;
        const region = document.getElementById("editRegion").value;
        const division = document.getElementById("editDivision").value;
        const subSelect = document.getElementById("editSubstation");
        
        subSelect.innerHTML = `<option value="" disabled selected>Select Sub-station...</option>`;
        
        if (zone && region && division && orgData.zones[zone].regions[region][division]) {
            const divData = orgData.zones[zone].regions[region][division];
            if (divData["Sub-stations"]) {
                const subData = divData["Sub-stations"];
                if (Array.isArray(subData)) {
                    subData.forEach(sub => {
                        subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                    });
                } else if (typeof subData === 'object') {
                    Object.values(subData).forEach(sub => {
                        subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                    });
                }
            } 
            subSelect.disabled = false;
        }
    }

    function toggleCustomType() {
        const typeSelect = document.getElementById("editType");
        const customGroup = document.getElementById("customTypeGroup");
        if (typeSelect.value === "Under Specify") {
            customGroup.style.display = "block";
        } else {
            customGroup.style.display = "none";
        }
    }

    function openEditModal() {
        populateZones();

        if (currentApp.division) {
            let foundZone = null, foundRegion = null;
            for (const z in orgData.zones) {
                for (const r in orgData.zones[z].regions) {
                    if (orgData.zones[z].regions[r][currentApp.division]) {
                        foundZone = z; foundRegion = r; break;
                    }
                }
                if (foundZone) break;
            }

            if (foundZone && foundRegion) {
                document.getElementById("editZone").value = foundZone;
                updateRegions();
                document.getElementById("editRegion").value = foundRegion;
                updateDivisions();
                document.getElementById("editDivision").value = currentApp.division;
                updateSubStations();
                if (currentApp.substation) {
                    document.getElementById("editSubstation").value = currentApp.substation;
                }
            }
        }
        
        const currentType = currentApp.applicant?.type || "LT";
        const standardTypes = ["LT", "11 KV HT", "33 KV HT", "SOLAR", "PROCEDURE-B"];
        if (standardTypes.includes(currentType)) {
            document.getElementById("editType").value = currentType;
            document.getElementById("customTypeGroup").style.display = "none";
        } else {
            document.getElementById("editType").value = "Under Specify";
            document.getElementById("customTypeGroup").style.display = "block";
            document.getElementById("editCustomType").value = currentType;
        }

        document.getElementById("editAddress").value = currentApp.applicant?.address || "";
        document.getElementById("editDemand1st").value = currentApp.proposed_demand_1st || "";
        document.getElementById("editDemand2nd").value = currentApp.proposed_demand_2nd || "";
        document.getElementById("editDemand3rd").value = currentApp.proposed_demand_3rd || "";
        document.getElementById("editDemand4th").value = currentApp.proposed_demand_4th || "";
        document.getElementById("editDemand5th").value = currentApp.proposed_demand_5th || "";

        document.getElementById("editModal").classList.add("show");
    }

    function closeEditModal() {
        document.getElementById("editModal").classList.remove("show");
    }

    async function saveEdit() {
        const newSubstation = document.getElementById("editSubstation").value;
        const newDivision = document.getElementById("editDivision").value;

        if (!newDivision) { showToast("Please select a Division", "error"); return; }

        let newType = document.getElementById("editType").value;
        if (newType === "Under Specify") {
            newType = document.getElementById("editCustomType").value.trim();
            if (!newType) { showToast("Please enter a custom type.", "error"); return; }
        }

        const payload = {
            division: newDivision,
            substation: newSubstation,
            applicant: {
                ...currentApp.applicant,
                type: newType,
                address: document.getElementById("editAddress").value
            },
            proposed_demand_1st: document.getElementById("editDemand1st").value,
            proposed_demand_2nd: document.getElementById("editDemand2nd").value,
            proposed_demand_3rd: document.getElementById("editDemand3rd").value,
            proposed_demand_4th: document.getElementById("editDemand4th").value,
            proposed_demand_5th: document.getElementById("editDemand5th").value
        };

        try {
            await blockApi.update(appId, payload);
            showToast("Application updated successfully", "success");
            closeEditModal();
            loadData();
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function deleteApplication() {
        const confirm = await showConfirm({
            title: "Delete Application",
            message: "Are you sure you want to delete this application permanently?",
            confirmText: "Yes, Delete"
        });
        if (!confirm) return;

        try {
            await blockApi.delete(appId);
            showToast("Application deleted", "success");
            setTimeout(() => { window.location.href = `/block-detail.html?block=${blockId}`; }, 1000);
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    loadData();
  </script>
</body>
</html>
