<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrical Works — Overview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* GLOBAL RESET & LIGHT THEME */
    * { box-sizing: border-box; }
    html, body { background-color: #f8fafc !important; color: #0f172a !important; font-family: 'Inter', sans-serif; margin: 0; padding: 0; min-height: 100vh; width: 100%; overflow-x: hidden; }

    /* Main Layout (Full Width now) */
    .app-container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .page-header h1 { font-size: 24px; font-weight: 800; margin: 0; }
    .btn-back { background: white; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 6px; text-decoration: none; color: #333; font-weight: 700; font-size: 13px; }

    /* Table Card */
    .table-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); overflow: hidden; }
    .table-toolbar { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 15px; background: #f8fafc; }
    .toolbar-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .table-title { font-size: 20px; font-weight: 800; margin: 0; color: #0f172a; }
    
    .stat-boxes { display: flex; gap: 10px; }
    .stat-card { background: white; padding: 8px 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; min-width: 70px; }
    .stat-card h2 { font-size: 18px; margin: 0; color: #2563eb; font-weight: 800; }
    .stat-card.green h2 { color: #10b981; }
    .stat-card p { margin: 0; font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }

    .toolbar-filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbar-filters select { flex: 1; min-width: 150px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; background: white; }

    /* Table */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
    th { background: white; padding: 14px 20px; font-size: 11px; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    td { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; font-size: 13px; font-weight: 600; vertical-align: middle; white-space: nowrap; }
    
    .clickable-row { cursor: pointer; transition: background-color 0.2s; }
    .clickable-row:hover { background-color: #f0f9ff; }

    .progress-container { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .progress-bar-bg { flex: 1; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #f59e0b; border-radius: 3px; }
    .progress-text { font-size: 11px; font-weight: 800; color: #d97706; }
    
    .grand-total-row { background: #f8fafc; font-weight: 800; font-size: 14px; border-top: 2px solid #cbd5e1; }

    /* --- DRAWER STYLES --- */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); z-index: 9998; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
    .drawer-overlay.show { opacity: 1; visibility: visible; }
    
    .drawer { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background: white; z-index: 9999; box-shadow: -10px 0 30px rgba(0,0,0,0.1); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
    .drawer.show { right: 0; }
    
    .drawer-header { padding: 20px 25px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: space-between; align-items: flex-start; }
    .drawer-header h2 { font-size: 18px; font-weight: 800; margin: 0 0 5px 0; line-height: 1.3; }
    .drawer-header p { margin: 0; font-size: 13px; color: #64748b; font-weight: 600; }
    .drawer-close { background: white; border: 1px solid #cbd5e1; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748b; flex-shrink: 0; margin-left: 10px; }
    
    .drawer-body { padding: 20px 25px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    /* Status Menu Items */
    .status-menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; text-decoration: none; color: #0f172a; font-weight: 700; font-size: 14px; transition: 0.2s; cursor: pointer; }
    .status-menu-item:hover { background: #eff6ff; border-color: #bfdbfe; transform: translateX(-5px); }
    .status-menu-item .count { background: white; border: 1px solid #cbd5e1; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; }
    
    .status-menu-item.all-item { background: #2563eb; color: white; border: none; margin-bottom: 10px; }
    .status-menu-item.all-item:hover { background: #1d4ed8; transform: translateX(0); }
    .status-menu-item.all-item .count { background: rgba(255,255,255,0.2); color: white; border: none; }

    /* FAB */
    .fab { position: fixed; bottom: 40px; right: 40px; background: #2563eb; color: white; border-radius: 50%; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; text-decoration: none; box-shadow: 0 10px 25px rgba(37,99,235,0.4); z-index: 100; }

    @media (max-width: 900px) {
        .app-container { padding: 15px; }
        .page-header { flex-direction: column; align-items: flex-start; gap: 15px; }
        .toolbar-filters { flex-direction: column; width: 100%; }
        .fab { width: 56px; height: 56px; bottom: 20px; right: 20px; }
        .drawer { width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="page-header">
        <h1>⚡ Electrical Works</h1>
        <a href="/dashboard.html" class="btn-back">← Back to App</a>
    </div>

    <!-- MAIN CARD -->
    <div class="table-card">
        <div class="table-toolbar">
            <div class="toolbar-top">
                <h2 class="table-title">Schemes Overview</h2>
                <div class="stat-boxes">
                    <div class="stat-card">
                        <h2 id="totalSchemes">0</h2>
                        <p>Total</p>
                    </div>
                    <div class="stat-card green">
                        <h2 id="completedSchemes">0</h2>
                        <p>Completed</p>
                    </div>
                </div>
            </div>

            <div class="toolbar-filters">
                <select id="filterCategory" onchange="updateFilters()">
                    <option value="All">All Categories</option>
                    <option value="Sub-station and PTR">🏢 Sub-station and PTR</option>
                    <option value="33 KV">⚡ 33 KV Category</option>
                    <option value="11 KV">🔌 11 KV Category</option>
                    <option value="Misc">🏗️ Misc Category</option>
                </select>

                <select id="filterSchemeHead" onchange="fetchOverviewTable()">
                    <option value="All">All Scheme Heads</option>
                </select>
                
                <select id="filterZone" onchange="updateFilterRegions()"><option value="">All Zones</option></select>
                <select id="filterRegion" onchange="updateFilterDivisions()" disabled><option value="">All Regions</option></select>
                <select id="filterDivision" onchange="fetchOverviewTable()" disabled><option value="">All Divisions</option></select>
            </div>
        </div>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Scheme Category</th>
                        <th>Division</th>
                        <th>Total</th>
                        <th>Completed</th>
                        <th>In Progress</th>
                        <th>Pending</th>
                        <th>Progress</th>
                        <th>Last Updated</th>
                    </tr>
                </thead>
                <tbody id="overviewTableBody">
                    <tr><td colspan="9" style="text-align:center; padding: 30px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
  </div>

  <!-- DRAWER (SLIDE MENU) -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  
  <div id="sideDrawer" class="drawer">
      <div class="drawer-header">
          <div>
              <h2 id="drawerTitle">Scheme Name</h2>
              <p id="drawerSubTitle">Division Name</p>
          </div>
          <button class="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody">
          <!-- Populated dynamically -->
      </div>
  </div>

  <a href="/electrical-new.html?block=electrical_works" class="fab" title="Add New Scheme">+</a>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>

  <script>
    let allSchemes = [];
    let orgData = {};
    
    let currentPhase = "All";
    let currentCategory = "All";
    let activeRow = null; 

    const CATEGORY_MAPPING = {
        "Sub-station and PTR": ["New SS", "PTR Augmentation / New PTR"],
        "33 KV": ["33KV Second Source / Tapping Source Elemination", "Augmentation of conductor size of 33kV Feeders", "Augmentation of conductor size of 33kV Switchyard"],
        "11 KV": ["Bifurcation of 11kV Feeders", "Augmentation of conductor size of 11kV Feeders", "HT AB Cable Conversion"],
        "Misc": ["Control Room Extension / Modification"]
    };

    const MASTER_SCHEME_HEADS = [
        { category: "Sub-station and PTR", head: "New SS" },
        { category: "Sub-station and PTR", head: "PTR Augmentation / New PTR" },
        { category: "33 KV", head: "33KV Second Source / Tapping Source Elemination" },
        { category: "33 KV", head: "Augmentation of conductor size of 33kV Feeders" },
        { category: "33 KV", head: "Augmentation of conductor size of 33kV Switchyard" },
        { category: "11 KV", head: "Bifurcation of 11kV Feeders" },
        { category: "11 KV", head: "Augmentation of conductor size of 11kV Feeders" },
        { category: "11 KV", head: "HT AB Cable Conversion" },
        { category: "Misc", head: "Control Room Extension / Modification" }
    ];

    async function init() {
        try {
            orgData = await apiFetch("/api/org-structure");
            const zoneSelect = document.getElementById("filterZone");
            if (orgData.zones) {
                Object.keys(orgData.zones).forEach(z => {
                    zoneSelect.innerHTML += `<option value="${z}">${z}</option>`;
                });
            }
        } catch (e) { console.error("Failed org load", e); }

        try {
            const res = await BlockAPI("electrical_works").list();
            allSchemes = res.items || [];
        } catch(e) { console.error(e); }

        updateFilters();
        fetchOverviewTable();
    }

    function updateFilters() {
        currentCategory = document.getElementById("filterCategory").value;
        
        const headSelect = document.getElementById("filterSchemeHead");
        headSelect.innerHTML = `<option value="All">All Scheme Heads</option>`;
        MASTER_SCHEME_HEADS.forEach(item => {
            if (currentCategory === "All" || currentCategory === item.category) {
                headSelect.innerHTML += `<option value="${escapeHtml(item.head)}">${escapeHtml(item.head)}</option>`;
            }
        });

        fetchOverviewTable();
    }

    function updateFilterRegions() {
        const zone = document.getElementById("filterZone").value;
        const regSelect = document.getElementById("filterRegion");
        const divSelect = document.getElementById("filterDivision");
        regSelect.innerHTML = `<option value="">All Regions</option>`;
        divSelect.innerHTML = `<option value="">All Divisions</option>`;
        divSelect.disabled = true;
        
        if (zone && orgData.zones[zone]) {
            Object.keys(orgData.zones[zone].regions).forEach(r => {
                regSelect.innerHTML += `<option value="${r}">${r}</option>`;
            });
            regSelect.disabled = false;
        } else { regSelect.disabled = true; }
        
        fetchOverviewTable();
    }

    function updateFilterDivisions() {
        const zone = document.getElementById("filterZone").value;
        const region = document.getElementById("filterRegion").value;
        const divSelect = document.getElementById("filterDivision");
        divSelect.innerHTML = `<option value="">All Divisions</option>`;
        
        if (zone && region && orgData.zones[zone].regions[region]) {
            Object.keys(orgData.zones[zone].regions[region]).forEach(d => {
                divSelect.innerHTML += `<option value="${d}">${d}</option>`;
            });
            divSelect.disabled = false;
        } else { divSelect.disabled = true; }
        
        fetchOverviewTable();
    }

    async function fetchOverviewTable() {
        try {
            const zoneVal = document.getElementById("filterZone").value;
            const regionVal = document.getElementById("filterRegion").value;
            const divisionVal = document.getElementById("filterDivision").value;
            const headVal = document.getElementById("filterSchemeHead").value;

            const params = new URLSearchParams();
            if (currentPhase !== "All") params.append("phase", currentPhase);
            if (zoneVal) params.append("zone", zoneVal);
            if (regionVal) params.append("region", regionVal);
            if (divisionVal) params.append("division", divisionVal);
            
            const groupedData = await apiFetch(`/api/blocks/electrical_works/overview-table?${params.toString()}`);
            
            let filteredData = groupedData.filter(row => {
                if (currentCategory !== "All") {
                    const allowedHeads = CATEGORY_MAPPING[currentCategory];
                    if (!allowedHeads || !allowedHeads.includes(row.scheme_head)) return false;
                }
                if (headVal !== "All" && row.scheme_head !== headVal) return false;
                return true;
            });

            if (headVal === "All" && currentCategory === "All") {
                let existingHeads = filteredData.map(r => r.scheme_head);
                MASTER_SCHEME_HEADS.forEach(item => {
                    if (!existingHeads.includes(item.head)) {
                        filteredData.push({
                            scheme_head: item.head,
                            division: divisionVal || "All / N/A",
                            total: 0, completed: 0, in_progress: 0, pending: 0,
                            progress_pct: 0,
                            last_updated: "N/A"
                        });
                    }
                });
            }

            filteredData.sort((a, b) => a.scheme_head.localeCompare(b.scheme_head));

            const total = filteredData.reduce((sum, item) => sum + item.total, 0);
            const completed = filteredData.reduce((sum, item) => sum + item.completed, 0);
            document.getElementById("totalSchemes").innerText = total;
            document.getElementById("completedSchemes").innerText = completed;

            let html = "";
            let idx = 1;
            filteredData.forEach(row => {
                const rowDataStr = encodeURIComponent(JSON.stringify(row));
                
                html += `
                    <tr class="clickable-row" onclick="openDrawer('${rowDataStr}')">
                        <td>${idx++}</td>
                        <td style="font-weight:700;">${escapeHtml(row.scheme_head)}</td>
                        <td style="font-weight:600; color:#475569;">${escapeHtml(row.division)}</td>
                        <td>${row.total}</td>
                        <td style="color:#10b981;">${row.completed}</td>
                        <td style="color:#8b5cf6;">${row.in_progress}</td>
                        <td style="color:#d97706;">${row.pending}</td>
                        <td>
                            <div class="progress-container">
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${row.progress_pct}%;"></div></div>
                                <span class="progress-text">${row.progress_pct}%</span>
                            </div>
                        </td>
                        <td style="font-size:12px; color:#64748b;">${row.last_updated}</td>
                    </tr>
                `;
            });

            if (filteredData.length === 0) {
                html = `<tr><td colspan="9" style="text-align:center; padding: 30px; color:#64748b;">No schemes match your current filters.</td></tr>`;
            } else {
                const totalPct = Math.round((completed / total) * 100) || 0;
                html += `
                    <tr class="grand-total-row">
                        <td colspan="3">GRAND TOTAL</td>
                        <td>${total}</td>
                        <td style="color:#10b981;">${completed}</td>
                        <td style="color:#8b5cf6;">${filteredData.reduce((sum, item) => sum + item.in_progress, 0)}</td>
                        <td style="color:#d97706;">${filteredData.reduce((sum, item) => sum + item.pending, 0)}</td>
                        <td>
                            <div class="progress-container">
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${totalPct}%;"></div></div>
                                <span class="progress-text">${totalPct}%</span>
                            </div>
                        </td>
                        <td></td>
                    </tr>
                `;
            }

            document.getElementById("overviewTableBody").innerHTML = html;

        } catch (e) {
            document.getElementById("overviewTableBody").innerHTML = `<tr><td colspan="9" style="color:red; text-align:center;">Error: ${e.message}</td></tr>`;
        }
    }

    // --- DRAWER LOGIC ---
    function openDrawer(encodedData) {
        activeRow = JSON.parse(decodeURIComponent(encodedData));
        
        // Set Header
        document.getElementById("drawerTitle").innerText = activeRow.scheme_head;
        document.getElementById("drawerSubTitle").innerText = `Division: ${activeRow.division}`;
        
        // Calculate status breakdown for this specific scheme head and division
        const statuses = {
            "Proposal to Initiate": 0, 
            "Approval pending": 0, 
            "TAA issued, work yet to start": 0,
            "Work in progress": 0, 
            "Completed": 0, 
            "Not updated": 0
        };

        const relevantSchemes = allSchemes.filter(s => 
            s.scheme_head === activeRow.scheme_head && 
            (activeRow.division === "All / N/A" || s.division === activeRow.division)
        );

        relevantSchemes.forEach(s => {
            if (s.status === "completed") statuses["Completed"]++;
            else if (s.current_stage === 1) statuses["Proposal to Initiate"]++;
            else if (s.current_stage === 2) statuses["Approval pending"]++;
            else if (s.current_stage === 3) statuses["TAA issued, work yet to start"]++;
            else if (s.current_stage === 4) statuses["Work in progress"]++;
            else statuses["Not updated"]++;
        });

        // Build Drawer Body
        let bodyHtml = `
            <a href="/electrical-list.html?head=${encodeURIComponent(activeRow.scheme_head)}&division=${encodeURIComponent(activeRow.division)}" class="status-menu-item all-item">
                <span>View All Schemes</span>
                <span class="count">${activeRow.total}</span>
            </a>
        `;

        Object.keys(statuses).forEach(st => {
            const count = statuses[st];
            const url = `/electrical-list.html?head=${encodeURIComponent(activeRow.scheme_head)}&division=${encodeURIComponent(activeRow.division)}&status=${encodeURIComponent(st)}`;
            
            bodyHtml += `
                <a href="${url}" class="status-menu-item">
                    <span>${st}</span>
                    <span class="count">${count}</span>
                </a>
            `;
        });

        document.getElementById("drawerBody").innerHTML = bodyHtml;
        
        // Show Drawer
        document.getElementById("drawerOverlay").classList.add("show");
        document.getElementById("sideDrawer").classList.add("show");
    }

    function closeDrawer() {
        document.getElementById("drawerOverlay").classList.remove("show");
        document.getElementById("sideDrawer").classList.remove("show");
    }

    init();
  </script>
</body>
</html>
