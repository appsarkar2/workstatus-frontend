<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Detail — WorkStatus</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="app-body">

  <div id="app"></div>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/components.js"></script>

  <script>
    // ── Read params from URL ──
    const params  = new URLSearchParams(window.location.search);
    const appId   = params.get("id");
    const blockId = params.get("block") || "bulk_connection";

    if (!appId) window.location.href = "/dashboard.html";

    const blockApi = BlockAPI(blockId);

    // ── State ──
    let currentApp = null;
    let currentConfig = null;

    // ── Render loading shell ──
    const root = document.getElementById("app");
    root.innerHTML = `
      ${header({
        title: "Application",
        back: true,
        backOnClick: `location.href='/block-detail.html?block=${blockId}'`,
        actions: [
          { icon: "🔄", onClick: "loadApp()", title: "Refresh" }
        ]
      })}
      <section class="app-header-card">
        ${emptyState("⏳", "Loading application...")}
      </section>
    `;

    // ── Load data ──
    async function loadApp() {
      try {
        const [app, cfg] = await Promise.all([
          blockApi.getOne(appId),
          blockApi.getConfig(),
        ]);
        currentApp = app;
        currentConfig = cfg;
        render();
      } catch (e) {
        document.querySelector(".app-header-card").innerHTML =
          emptyState("⚠️", e.message || "Failed to load");
      }
    }

    // ── Render full page ──
    function render() {
      const a = currentApp;
      const cfg = currentConfig;
      const totalStages = (a.stages && a.stages.length) || (cfg.stages && cfg.stages.length) || 13;

      const completed = (a.stages || []).filter(s => s.status === "completed").length;
      const pct = Math.round((completed / totalStages) * 100);

      const docs       = cfg.documents_required || [];
      const gotDocs    = a.documents || {};

      root.innerHTML = `
        ${header({
          title: a.application_no,
          back: true,
          backOnClick: `location.href='/block-detail.html?block=${blockId}'`,
          actions: [
            { icon: "🔄", onClick: "loadApp()", title: "Refresh" }
          ]
        })}

        <section class="app-header-card">
          <div class="app-header-top">
            <div class="app-header-name">${escapeHtml(a.applicant?.name || "—")}</div>
            ${statusBadge(a.status)}
          </div>
          <div class="app-header-meta">
            Application No: <b>${escapeHtml(a.application_no)}</b> · Stage <b>${a.current_stage}</b> of ${totalStages}
          </div>
        </section>

        ${card("", `
          <div class="detail-grid">
            <div class="detail-block"><div class="detail-label">👤 Applicant</div><div class="detail-value">${escapeHtml(a.applicant?.name || "—")}</div></div>
            <div class="detail-block"><div class="detail-label">📞 Contact</div><div class="detail-value">${escapeHtml(a.applicant?.contact || "—")}</div></div>
            <div class="detail-block"><div class="detail-label">📧 Email</div><div class="detail-value">${escapeHtml(a.applicant?.email || "—")}</div></div>
            <div class="detail-block"><div class="detail-label">📍 Division</div><div class="detail-value">${escapeHtml(a.division || "—")}</div></div>
            <div class="detail-block"><div class="detail-label">🏢 Type</div><div class="detail-value">${escapeHtml(a.applicant?.type || "—")}</div></div>
            <div class="detail-block"><div class="detail-label">📅 Application Date</div><div class="detail-value">${formatDate(a.application_date)}</div></div>
            <div class="detail-block"><div class="detail-label">👤 Assigned To</div><div class="detail-value">${escapeHtml(a.assigned_to || "Unassigned")}</div></div>
            <div class="detail-block"><div class="detail-label">🕒 Updated</div><div class="detail-value">${timeAgo(a.updated_at || a.created_at)}</div></div>
          </div>
        `)}

        <section class="detail-card">
          <div class="section-header">
            <h2 class="section-title">Stage Progress</h2>
            <span class="progress-pct">${pct}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </section>

        <section class="tasks-section">
          <h2 class="section-title">Stages</h2>
          <div class="stages-list">
            ${(a.stages || []).map(s => renderStage(s)).join("")}
          </div>
        </section>

        ${card("📎 Documents", `
          <div class="docs-grid">
            ${docs.map(d => `
              <div class="doc-chip ${gotDocs[d.key] ? "doc-yes" : "doc-no"}">
                ${gotDocs[d.key] ? "✅" : "⏳"} ${escapeHtml(d.label)}
              </div>
            `).join("")}
          </div>
        `)}
      `;
    }

    // ── Render a single stage ──
    function renderStage(s) {
      const icon =
        s.status === "completed"     ? "✅" :
        s.status === "in_progress"   ? "🔄" :
        s.status === "not_applicable"? "⚪" :
        s.status === "rejected"      ? "❌" : "⏳";

      const canAct = s.status === "in_progress";

      let metaLine = "";
      if (s.status === "completed" && s.completed_by) {
        metaLine = `Completed by <b>${escapeHtml(s.completed_by)}</b> · ${formatDate(s.completed_at)}`;
      } else if (s.status === "in_progress") {
        metaLine = `In progress · Started ${timeAgo(s.started_at)}`;
      } else {
        metaLine = "Pending";
      }

      return `
        <div class="stage-item stage-${s.status}">
          <div class="stage-row">
            <div class="stage-icon">${icon}</div>
            <div class="stage-content">
              <div class="stage-name">${s.stage_no}. ${escapeHtml(s.name)}</div>
              <div class="stage-meta">${metaLine}</div>
              ${s.remarks ? `<div class="stage-remark">"${escapeHtml(s.remarks)}"</div>` : ""}
            </div>
          </div>
          ${canAct ? `
            <div class="stage-actions">
              <button class="small-btn" onclick="markComplete(${s.stage_no})">✅ Mark Complete</button>
              <button class="small-btn btn-outline" onclick="addRemark(${s.stage_no})">💬 Add Remark</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    // ── Actions ──
    async function markComplete(stageNo) {
      const remarks = await showPrompt({
        title: `Complete Stage ${stageNo}`,
        placeholder: "Add remarks (optional)...",
        confirmText: "Mark Complete",
        multiline: true,
      });
      if (remarks === null) return;

      try {
        await blockApi.updateStage(appId, {
          stage_no: stageNo,
          status: "completed",
          remarks: remarks,
        });
        showToast("Stage completed ✅", "success");
        await loadApp();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    async function addRemark(stageNo) {
      const remark = await showPrompt({
        title: `Add Remark to Stage ${stageNo}`,
        placeholder: "Enter your remark...",
        confirmText: "Save",
        multiline: true,
      });
      if (remark === null || !remark.trim()) return;

      try {
        await blockApi.updateStage(appId, {
          stage_no: stageNo,
          status: "in_progress",
          remarks: remark,
        });
        showToast("Remark added ✅", "success");
        await loadApp();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    // ── Boot ──
    loadApp();
  </script>
</body>
</html>
