<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interruption Report — WorkStatus</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  
  <style>
    /* Custom styles to match the Puja dashboard layout */
    .app-body { background-color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh; }
    .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
    /* Header */
    .top-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    .header-title { font-size: 20px; font-weight: 800; color: #0f172a; }
    .header-actions { display: flex; gap: 10px; }
    
    /* Filters */
    .filter-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
    .input-group label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
    .input-field { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; }
    
    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 20px; }
    @media (max-width: 768px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6; }
    .kpi-card:nth-child(1) { border-left-color: #3b82f6; }
    .kpi-card:nth-child(2) { border-left-color: #f97316; }
    .kpi-card:nth-child(3) { border-left-color: #8b5cf6; }
    .kpi-card:nth-child(4) { border-left-color: #10b981; }
    .kpi-card:nth-child(5) { border-left-color: #ef4444; }
    .kpi-title { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
    .kpi-value { font-size: 28px; font-weight: 800; color: #0f172a; }
    
    /* Table */
    .chart-card { background: white; padding: 24px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .table-container { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f8fafc; padding: 12px; font-size: 12px; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #0f172a; }
    
    /* Drawer */
    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1000; }
    .drawer-overlay.show { display: block; }
    .drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 600px; height: 100vh; background: white; z-index: 1001; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .drawer.show { right: 0; }
    .drawer-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .drawer-body { padding: 20px; overflow-y: auto; flex: 1; }
  </style>
</head>
<body class="app-body">

  <div class="page-container">
    
    <!-- Header -->
    <div class="top-header">
      <div class="header-title">⚡ Interruption Report</div>
      <div class="header-actions">
        <button class="btn btn-primary" id="btnUploadCsv" onclick="document.getElementById('csvUpload').click()">📤 Upload CSV</button>
        <input type="file" id="csvUpload" accept=".csv" style="display:none;">
        <a href="/dashboard.html" class="btn btn-light">← Back</a>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-card">
      <div class="filter-grid">
        <div class="input-group"><label>Zone</label><select id="filter_zone" class="input-field"><option value="">All Zones</option></select></div>
        <div class="input-group"><label>Region</label><select id="filter_reg" class="input-field"><option value="">All Regions</option></select></div>
        <div class="input-group"><label>Division</label><select id="filter_divn_name" class="input-field"><option value="">All Divisions</option></select></div>
        <div class="input-group"><label>Substation</label><select id="filter_substation" class="input-field"><option value="">All Substations</option></select></div>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-title">Total Feeders</div><div class="kpi-value" id="kpi-total-feeders">0</div></div>
      <div class="kpi-card"><div class="kpi-title">Avg Daily Outage</div><div class="kpi-value" id="kpi-avg-daily">0</div></div>
      <div class="kpi-card"><div class="kpi-title">Monthly Range</div><div class="kpi-value" id="kpi-monthly-range">0</div></div>
      <div class="kpi-card"><div class="kpi-title">Avg Yearly</div><div class="kpi-value" id="kpi-avg-yearly">0</div></div>
      <div class="kpi-card"><div class="kpi-title">Concern Feeders</div><div class="kpi-value" id="kpi-concern-feeders">0</div></div>
    </div>

    <!-- Table -->
    <div class="chart-card">
      <h3 class="chart-title">Feeders List (Highest to Lowest Outage)</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Feeder Name</th>
              <th>Substation</th>
              <th>Daily (Hrs)</th>
              <th>Monthly (Hrs)</th>
              <th>Trips</th>
            </tr>
          </thead>
          <tbody id="feederTableBody">
            <tr><td colspan="5" style="text-align:center;">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="detailsDrawerOverlay" onclick="closeDetailsDrawer()"></div>
  <div class="drawer" id="detailsDrawer">
      <div class="drawer-header">
          <h3 id="drawerTitle" style="margin: 0;">Application Details</h3>
          <button onclick="closeDetailsDrawer()" style="background:none; border:none; font-size: 24px; cursor: pointer;">×</button>
      </div>
      <div class="drawer-body">
          <table style="width:100%; border-collapse: collapse;">
              <thead>
                  <tr style="border-bottom: 2px solid #e2e8f0; text-align: left;">
                      <th style="padding: 10px;">Feeder</th>
                      <th style="padding: 10px;">Substation</th>
                      <th style="padding: 10px;">Daily</th>
                      <th style="padding: 10px;">Monthly</th>
                      <th style="padding: 10px;">Trips</th>
                  </tr>
              </thead>
              <tbody id="detailsDrawerBody"></tbody>
          </table>
      </div>
  </div>

  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/pages/interruption-dashboard.js"></script>
</body>
</html>
