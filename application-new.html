<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routing — WorkStatus</title>
</head>
<body style="background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
  
  <div style="text-align: center;">
    <h2 style="color: #64748b;">Redirecting to form...</h2>
  </div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const blockId = params.get("block") || "bulk_connection";

    // Map block IDs to their dedicated form files
    const formRoutes = {
        "bulk_connection": "/bulk-new.html",
        "civil_work": "/civil-new.html",
        "electrical_work": "/electrical-new.html"
    };

    const targetRoute = formRoutes[blockId];
    
    if (targetRoute) {
        window.location.href = `${targetRoute}?block=${blockId}`;
    } else {
        document.body.innerHTML = `
            <div style="text-align: center;">
                <h2 style="color: #ef4444;">Form Not Found</h2>
                <p style="color: #64748b;">No form has been built for the block: <b>${blockId}</b></p>
                <a href="/dashboard.html" style="color: #3b82f6; text-decoration: none;">← Back to Dashboard</a>
            </div>
        `;
    }
  </script>
</body>
</html>
