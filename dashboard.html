<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <title>WorkStatus — Home</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/modals.css" />
<link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="app-body">

  <!-- ═══════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">WorkStatus</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" title="Contact">📞</button>
      <button class="icon-btn" title="Location">📍</button>
      <button class="icon-btn" title="Notifications">🔔</button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════
       USER CARD
       ═══════════════════════════════════════════════════════ -->
  <section class="user-card">
    <div class="user-avatar">👤</div>
    <div class="user-info">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-role" id="userRole">—</div>
    </div>
    <button class="chevron-btn" onclick="toggleUserMenu()">▼</button>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       SEARCH BAR
       ═══════════════════════════════════════════════════════ -->
  <section class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search blocks or tasks..." />
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       QUICK ACTION BANNER
       ═══════════════════════════════════════════════════════ -->
  <section class="banner">
    <div class="banner-text">
      <div class="banner-title">Quick Actions</div>
      <div class="banner-sub">Create a task or view today's work</div>
    </div>
    <button class="banner-btn" onclick="comingSoon()">New Task</button>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       MY BLOCKS GRID
       ═══════════════════════════════════════════════════════ -->
  <section class="blocks-section">
    <h2 class="section-title">My Blocks</h2>
    <div class="block-grid" id="blockGrid">
      <!-- Cards injected by JS -->
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       BOTTOM NAVIGATION
       ═══════════════════════════════════════════════════════ -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item" onclick="comingSoon()">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Blocks</span>
    </a>
    <a href="#" class="nav-item" onclick="comingSoon()">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Reports</span>
    </a>
    <a href="/dashboard.html" class="nav-item active">
      <span class="nav-icon active-circle">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="#" class="nav-item" onclick="comingSoon()">
      <span class="nav-icon">📤</span>
      <span class="nav-label">Uploads</span>
    </a>
    <a href="#" class="nav-item" onclick="logout()">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Logout</span>
    </a>
  </nav>

  <script>
    // ═══════════════════════════════════════════════════════
    // AUTH GUARD
    // ═══════════════════════════════════════════════════════
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/";

    const user = JSON.parse(localStorage.getItem("user") || "{}");

    // ═══════════════════════════════════════════════════════
    // POPULATE HEADER
    // ═══════════════════════════════════════════════════════
    document.getElementById("userName").textContent = user.name || user.username;
    document.getElementById("userRole").textContent = (user.role || "").replace("_", " ").toUpperCase();

    // ═══════════════════════════════════════════════════════
    // BLOCKS DATA
    // ═══════════════════════════════════════════════════════
    // For now, hardcoded. Later, fetch from /api/blocks
    const BLOCKS = [
      { id: "disconnection",  icon: "⚡", name: "Disconnection",    color: "pink"   },
      { id: "new_connection", icon: "🔌", name: "New Connection",   color: "green"  },
      { id: "transformer",    icon: "🔧", name: "Transformer",      color: "blue"   },
      { id: "meter_replace",  icon: "📊", name: "Meter Replace",    color: "yellow" },
      { id: "reports",        icon: "📈", name: "Reports",          color: "purple" },
      { id: "uploads",        icon: "📤", name: "Uploads",          color: "orange" },
      { id: "bulk_connection", icon: "📦", name: "Bulk Connection",  color: "purple" },
    ];

    // ═══════════════════════════════════════════════════════
    // RENDER BLOCKS
    // ═══════════════════════════════════════════════════════
    const grid = document.getElementById("blockGrid");
BLOCKS.forEach(block => {
  const card = document.createElement("a");
  card.href = `/block-detail.html?block=${block.id}`;
  card.className = `block-card ${block.color}`;
  card.innerHTML = `
    <div class="block-icon">${block.icon}</div>
    <div class="block-label">${block.name}</div>
  `;
  grid.appendChild(card);
});

    // ═══════════════════════════════════════════════════════
    // SEARCH
    // ═══════════════════════════════════════════════════════
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(".block-card").forEach(card => {
        const label = card.querySelector(".block-label").textContent.toLowerCase();
        card.style.display = label.includes(q) ? "" : "none";
      });
    });

    // ═══════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════
    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "/";
    }

    function toggleUserMenu() {
      comingSoon("Profile menu");
    }

    function comingSoon(label) {
      alert(`🚧 ${label || "This feature"} is coming soon!\n\nWe're building it step by step.`);
    }
  </script>
</body>
</html>
