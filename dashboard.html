<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <title>WorkStatus — Home</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="app-body">

  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/auth-guard.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/components.js"></script>
  <script src="/js/ui/charts.js"></script>

  <script>
    // ── Auth guard already ran (auth-guard.js) ──
    const user = getCurrentUser();

    // ── Compose the page ──
    const app = document.getElementById("app");

    app.innerHTML = `
      ${header({
        title: "WorkStatus",
        actions: [
          { icon: "📞", onClick: "comingSoon('Contact')", title: "Contact" },
          { icon: "📍", onClick: "comingSoon('Location')", title: "Location" },
          { icon: "🔔", onClick: "comingSoon('Notifications')", title: "Notifications" }
        ]
      })}

      <section class="user-card">
        <div class="user-avatar">👤</div>
        <div class="user-info">
          <div class="user-name">${escapeHtml(user.name || user.username || "User")}</div>
          <div class="user-role">${escapeHtml((user.role || "").replace("_", " ").toUpperCase())}</div>
        </div>
        <button class="chevron-btn" onclick="comingSoon('Profile menu')">▼</button>
      </section>

      ${searchBar("searchInput", "Search blocks...")}

      <section class="banner">
        <div class="banner-text">
          <div class="banner-title">Quick Actions</div>
          <div class="banner-sub">Create a task or view today's work</div>
        </div>
        <button class="banner-btn" onclick="comingSoon('New Task')">New Task</button>
      </section>

      <section class="blocks-section">
        <h2 class="section-title">My Blocks</h2>
        <div class="block-grid" id="blockGrid">
          ${emptyState("⏳", "Loading blocks...")}
        </div>
      </section>

      ${bottomNav("home")}
    `;

    // ── Load blocks from backend ──
    async function loadBlocks() {
      try {
        const data = await RegistryAPI.listBlocks();
        const blocks = data.blocks || [];
        const grid = document.getElementById("blockGrid");

        if (!blocks.length) {
          grid.innerHTML = emptyState("📭", "No blocks available");
          return;
        }

         grid.innerHTML = blocks.map(b => {
          // Route PUJA Load Demand to its custom page, others to generic block-detail
          const url = b.id === "puja_load_demand" 
            ? "/puja-load.html" 
            : `/block-detail.html?block=${encodeURIComponent(b.id)}`;
            
          return `
            <a href="${url}" class="block-card ${b.color || "blue"}">
              <div class="block-icon">${iconForBlock(b)}</div>
              <div class="block-label">${escapeHtml(b.name)}</div>
            </a>
          `;
        }).join("");
      } catch (e) {
        showError("blockGrid", e.message);
      }
    }

    // ── Icon mapping (backend config uses names like "box", "bolt") ──
    function iconForBlock(b) {
      const map = {
        box: "📦", bolt: "⚡", plug: "🔌",
        wrench: "🔧", chart: "📊", upload: "📤",
      };
      return map[b.icon] || "📁";
    }

    // ── Search filter (works on dynamically added cards) ──
    document.addEventListener("input", (e) => {
      if (e.target.id !== "searchInput") return;
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(".block-card").forEach(card => {
        const label = card.querySelector(".block-label")?.textContent.toLowerCase() || "";
        card.style.display = label.includes(q) ? "" : "none";
      });
    });

    // ── Helpers ──
    function comingSoon(label) {
      showToast(`🚧 ${label || "This feature"} coming soon`, "info");
    }

    // ── Boot ──
    loadBlocks();
  </script>
</body>
</html>
